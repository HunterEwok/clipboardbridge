[package]
name = "cbb-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
description = "The Rust core's entry point as C functions, for Go and the phone apps"
publish = false

[lib]
name = "cbb_ffi"
# staticlib for the iPhone and the Swift kit's tests, cdylib for Android and
# the Kotlin kit's tests (through JNA), lib for the Rust tests.
crate-type = ["lib", "staticlib", "cdylib"]

[features]
# join: a phone that joins by its QR code with a key the core does not hold
# (src/join.rs), on the core's TLS; only the Aurora app's build takes it.
join = ["cbb-core/tls", "dep:qrcode", "dep:rqrr", "dep:serde", "dep:serde_json"]
# member: the lite member's node inside the app, with the app's key
# (src/member.rs); only the Aurora app's build takes it.
member = ["join", "dep:cbb-lite"]
# tunnel: the phones' tunnel to the hub (src/tunnel.rs), WireGuard with
# AmneziaWG and VLESS with XHTTP, in place of the Go tunnel; the iPhone's and
# Android's builds take it.
tunnel = ["join", "dep:cbb-lite", "cbb-lite/tunnel", "dep:base64"]

[dependencies]
cbb-core = { path = "../core", features = ["std"] }
cbb-lite = { path = "../member", default-features = false, optional = true }
qrcode = { version = "0.14.1", default-features = false, optional = true }
rqrr = { version = "0.11.0", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }

[dev-dependencies]
serde_json = "1"
# The example phone-on-linux's software key and its answers' bytes.
base64 = "0.23"
p256 = { version = "0.14", default-features = false, features = ["alloc", "arithmetic", "ecdsa", "pkcs8"] }

[[example]]
name = "phone-on-linux"
required-features = ["member"]

[[example]]
name = "tunnel-on-linux"
required-features = ["tunnel"]
