# SPDX-License-Identifier: AGPL-3.0-only
# The iPhone app's Xcode project, for XcodeGen: cd apps/ios && xcodegen generate.
# The generated Clipbridge.xcodeproj and Info.plist are not committed.
name: Clipbridge
options:
  bundleIdPrefix: io.github.hunterewok
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  ClipbridgeKit:
    path: ClipbridgeKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Clipbridge:
    type: application
    platform: iOS
    sources:
      - Clipbridge
    dependencies:
      - package: ClipbridgeKit
    info:
      path: Clipbridge/Info.plist
      properties:
        CFBundleDisplayName: clipbridge
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSBonjourServices: [_clipbridge._tcp]
        NSLocalNetworkUsageDescription: clipbridge finds your computers on the home network and keeps their clipboard in sync with this phone.
        NSCameraUsageDescription: clipbridge scans the QR code a computer shows, to add it to your group.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hunterewok.clipbridge
        TARGETED_DEVICE_FAMILY: "1"
  ClipbridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClipbridgeTests
    dependencies:
      - target: Clipbridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Clipbridge:
    build:
      targets:
        Clipbridge: all
    test:
      targets:
        - ClipbridgeTests
