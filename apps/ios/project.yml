# SPDX-License-Identifier: AGPL-3.0-only
# The iPhone app's Xcode project, for XcodeGen: cd apps/ios && xcodegen generate.
# The generated ClipboardBridge.xcodeproj and Info.plist are not committed.
name: ClipboardBridge
options:
  bundleIdPrefix: io.github.hunterewok
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  ClipboardBridgeKit:
    path: ClipboardBridgeKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  ClipboardBridge:
    type: application
    platform: iOS
    sources:
      - ClipboardBridge
      - Shared
    dependencies:
      - package: ClipboardBridgeKit
      # Share and the text selection menu's Share (docs/apps.md).
      - target: ShareExtension
      # The home-screen widget and the Control Center control.
      - target: Widgets
      # The tunnel for sync away from home, a static framework bound by gomobile:
      # ../../mobile/cbbtun/bind.sh ios Cbbtun.xcframework (not committed).
      - framework: Cbbtun.xcframework
        embed: false
      - sdk: libresolv.tbd
    info:
      path: ClipboardBridge/Info.plist
      properties:
        CFBundleDisplayName: clipboardbridge
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSBonjourServices: [_clipboardbridge._tcp]
        NSLocalNetworkUsageDescription: clipboardbridge finds your computers on the home network and keeps their clipboard in sync with this phone.
        NSCameraUsageDescription: clipboardbridge scans the QR code a computer shows, to add it to your group.
        NSFaceIDUsageDescription: clipboardbridge asks for Face ID before it signs with your group's key, to add or remove a device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hunterewok.clipboardbridge
        # Drawn by tools/icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # OpenAndSyncIntent syncs only in the app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) CBB_APP
      configs:
        # The app group and the shared keychain need the Apple developer account;
        # debug builds, signed ad hoc, go without (Shared.swift).
        Release:
          CODE_SIGN_ENTITLEMENTS: ClipboardBridge/ClipboardBridge.entitlements
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared/Shared.swift
    dependencies:
      - package: ClipboardBridgeKit
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: clipboardbridge
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        NSBonjourServices: [_clipboardbridge._tcp]
        NSLocalNetworkUsageDescription: clipboardbridge finds your computers on the home network to send them what you share.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hunterewok.clipboardbridge.share
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
  Widgets:
    type: app-extension
    platform: iOS
    # Controls in Control Center need iOS 18.
    deploymentTarget: "18.0"
    sources:
      - Widgets
      - Shared/OpenAndSyncIntent.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: clipboardbridge
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hunterewok.clipboardbridge.widgets
        TARGETED_DEVICE_FAMILY: "1"
  ClipboardBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClipboardBridgeTests
    dependencies:
      - target: ClipboardBridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClipboardBridge:
    build:
      targets:
        ClipboardBridge: all
    test:
      targets:
        - ClipboardBridgeTests
