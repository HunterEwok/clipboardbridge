# SPDX-License-Identifier: AGPL-3.0-only
# The iPhone app's Xcode project, for XcodeGen: cd apps/ios && xcodegen generate.
# The generated CBB.xcodeproj and Info.plist are not committed.
name: CBB
options:
  bundleIdPrefix: tools.cbb
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  CBBKit:
    path: CBBKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The Rust core the kit links (its CCbbCore module), one library for each SDK:
    # sh ../../ffi/bind.sh ios CbbCore (not committed).
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/CbbCore/iphoneos
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/CbbCore/iphonesimulator
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # The app's bundle identifier; the extensions' and the watch's start with it.
    # device.sh sets another one for a build signed by a free Personal Team, so
    # that it never takes the identifiers the developer account will register.
    CBB_BUNDLE_ID: tools.cbb
targets:
  CBB:
    type: application
    platform: iOS
    sources:
      - CBB
      - Shared
    dependencies:
      - package: CBBKit
      # Share and the text selection menu's Share (docs/apps.md).
      - target: ShareExtension
      # The home-screen widget and the Control Center control.
      - target: Widgets
      # The Apple Watch app, in the app's Watch folder.
      - target: Watch
      # The tunnel for sync away from home, a static framework bound by gomobile:
      # ../../mobile/cbbtun/bind.sh ios Cbbtun.xcframework (not committed).
      - framework: Cbbtun.xcframework
        embed: false
      - sdk: libresolv.tbd
    info:
      path: CBB/Info.plist
      properties:
        CFBundleDisplayName: CBB
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        UILaunchScreen: {}
        # AppDelegate keeps a phone upright and lets big screens turn.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSSupportsLiveActivities: true
        # Now and then iOS wakes the app for a moment to hear of the group's
        # events (BackgroundRefresh.swift).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [tools.cbb.refresh]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSBonjourServices: [_cbb._tcp]
        # A dragged device tile (Views/Arrange.swift), which stays in the app.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: tools.cbb.tile
            UTTypeConformsTo: [public.data]
        NSLocalNetworkUsageDescription: CBB finds your computers on the home network and keeps their clipboard in sync with this phone.
        NSCameraUsageDescription: CBB scans the QR code a computer shows, to add it to your group.
        NSFaceIDUsageDescription: CBB asks for Face ID before it signs with your group's key, to add or remove a device.
        # The recovery key on a YubiKey (App/YubiKeyNfc.swift): Core NFC selects its PIV application.
        NFCReaderUsageDescription: CBB puts your group's recovery key on a YubiKey, and restores the group with it.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers: [A000000308]
        # Files a computer copied, saved by the button, show in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CBB_BUNDLE_ID)
        # Drawn by tools/icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # OpenAndSyncIntent syncs only in the app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) CBB_APP
      configs:
        # The app group, the shared keychain and NFC need the Apple developer account;
        # debug builds, signed ad hoc, go without (Shared.swift). device.sh with
        # CBB_NFC=1 gives a debug build NFC alone, for a team that has it.
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(CBB_DEBUG_ENTITLEMENTS)
        Release:
          CODE_SIGN_ENTITLEMENTS: CBB/CBB.entitlements
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared/Shared.swift
      - Shared/Images.swift
    dependencies:
      - package: CBBKit
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: CBB
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        NSBonjourServices: [_cbb._tcp]
        NSLocalNetworkUsageDescription: CBB finds your computers on the home network to send them what you share.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CBB_BUNDLE_ID).share
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
  Widgets:
    type: app-extension
    platform: iOS
    # Controls in Control Center need iOS 18.
    deploymentTarget: "18.0"
    sources:
      - Widgets
      - Shared/OpenAndSyncIntent.swift
      # The Live Activity in the Dynamic Island, in the app's colours.
      - Shared/StatusActivity.swift
      - CBB/Theme
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: CBB
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CBB_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1,2"
  Watch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Watch
      - Shared/WatchState.swift
      # The phone's colours.
      - CBB/Theme
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: CBB
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(CBB_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CBB_BUNDLE_ID).watchkitapp
        # Drawn by tools/icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
  CBBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CBBTests
    dependencies:
      - target: CBB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # The screens driven as a person would, on the simulator (XCUITest).
  CBBUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CBBUITests
      # The app's texts, to look up the Russian the screens show.
      - path: CBB/Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: CBB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CBB
        # The tests' own strings stay out of the app's catalog.
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  CBB:
    build:
      targets:
        CBB: all
    test:
      targets:
        - CBBTests
        - CBBUITests
