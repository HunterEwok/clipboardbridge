# The bench's inventory: copy it to ~/.config/cbb-bench/inventory.toml on the
# controller and fill in the real names. It never goes into the repository.
# docs/testbench.md, section 13, describes each key.

controller = "controller"

# ssh: the user signed in on the device's desktop, so the bench reaches the
# desktop clipboard; its key must work without a prompt (BatchMode).
[device.desktop]
os = "linux"
ssh = "user@desktop.lan"
# GNOME has no Wayland data-control protocol: cbb agent and the bench use
# its XWayland display. On KDE or wlroots, "wayland".
clipboard = "x11"
roles = ["member", "hub", "away"]
# reset: the installer opens the member port in the firewall.
firewall = "yes"

[device.lite]
os = "linux-lite"
ssh = "user@pi.lan"
roles = ["member"]

[device.mac]
os = "darwin"
ssh = "user@mac.lan"
clipboard = "macos"
roles = ["member"]

[device.win]
os = "windows"
ssh = "user@win.lan"
clipboard = "windows"
roles = ["member"]
# reset: uninstall.ps1 -Purge, then install.ps1 -Express of the build's zip.
# The user is an administrator, signed in on the desktop, and has run
# tools/bench/setup-windows.ps1 once.
firewall = "yes"

[device.remote]
os = "linux"
ssh = "user@remote.example.net"
clipboard = "none"
roles = ["away"]
# A server that does other work: reset leaves its firewall alone.
firewall = "no"

# The Docker image on a host, started with packaging/docker/compose.home.yaml:
# the bench runs cbb in it with docker exec. tools/bench/setup-docker.sh
# prepares the host and starts the container.
[device.nas]
os = "docker"
ssh = "user@controller.lan"
roles = ["member"]
# reset: setup-docker.sh in a checkout of the repository on the host.
setup = "~/clipboardbridge/tools/bench/setup-docker.sh"

# A second member on the remote server, in a network namespace of its own:
# its traffic goes out through a SOCKS5 proxy (here a VPN client's local
# inbound), not the server's own network; without UDP through the proxy it
# goes away from home with VLESS only.
# tools/bench/setup-netns.sh prepares the namespace and starts the member.
[device.remotevpn]
os = "netns"
ssh = "user@remote.example.net"
roles = ["away"]
# reset: setup-netns.sh on the host, after `setup-netns.sh setup remotevpn
# 127.0.0.1:1080 TUN2SOCKS` once.
setup = "/opt/cbbbench-netns/setup-netns.sh"

[router]
ssh = "root@router.lan"
kind = "openwrt"

# The forwarder the hub registers with in the away suite; ssh and service
# only for F7 (-stop-forwarder), which stops it.
[forwarder]
address = "relay.example.net:8764"
key = "the key cbb forward -show-key prints"
ssh = "user@relay.example.net"
service = "cbb-forward"

# The blind relay of the relay suite (P12).
[relay]
address = "relay.example.net:8765"
key = "the key cbb relay -show-key prints"
