# The bench's inventory: copy it to ~/.config/cbb-bench/inventory.toml on the
# controller and fill in the real names. It never goes into the repository.
# docs/testbench.md, section 13, describes each key.

controller = "pi4"

# ssh: the user signed in on the device's desktop, so the bench reaches the
# desktop clipboard; its key must work without a prompt (BatchMode).
[device.deck]
os = "linux"
ssh = "user@deck.lan"
# GNOME has no Wayland data-control protocol: cbb agent and the bench use
# its XWayland display. On KDE or wlroots, "wayland".
clipboard = "x11"
roles = ["member", "hub", "away"]
# reset: the installer opens the member port in the firewall.
firewall = "yes"

[device.rpi0w]
os = "linux-lite"
ssh = "user@pi.lan"
roles = ["member"]

[device.mac]
os = "darwin"
ssh = "user@mac.lan"
clipboard = "macos"
roles = ["member"]

[device.win]
os = "windows"
ssh = "user@win.lan"
clipboard = "windows"
roles = ["member"]
vm = { host = "mac", vmx = "~/Virtual Machines.localized/Windows 11 64-bit Arm.vmwarevm", snapshot = "clean" }

[device.vps]
os = "linux"
ssh = "user@vps.example.net"
clipboard = "none"
roles = ["away"]
# A server that does other work: reset leaves its firewall alone.
firewall = "no"

# The Docker image on a host, started with packaging/docker/compose.home.yaml:
# the bench runs cbb in it with docker exec. tools/bench/setup-docker.sh
# prepares the host and starts the container.
[device.nas]
os = "docker"
ssh = "user@pi4.lan"
roles = ["member"]
# reset: setup-docker.sh in a checkout of the repository on the host.
setup = "~/clipboardbridge/tools/bench/setup-docker.sh"

[router]
ssh = "root@router.lan"
kind = "openwrt"

# The forwarder the hub registers with in the away suite; ssh and service
# only for F7 (-stop-forwarder), which stops it.
[forwarder]
address = "relay.example.net:8764"
key = "sha256:the key cbb forward -show-key prints"
ssh = "user@relay.example.net"
service = "cbb-forward"

# The blind relay of the relay suite (P12).
[relay]
address = "relay.example.net:8765"
key = "sha256:the key cbb relay -show-key prints"
