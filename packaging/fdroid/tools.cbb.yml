# SPDX-License-Identifier: AGPL-3.0-only
# The app's F-Droid metadata, for the merge request to fdroiddata
# (metadata/tools.cbb.yml there; docs/maintaining.md, "F-Droid").
# F-Droid builds the fdroid flavor from each release's tag and, when its APK is the same as
# Binaries apart from the signature, publishes ours (docs/apps.md, "F-Droid").
# The store texts and the icon come from apps/android/app/fastlane.
Categories:
  - Connectivity
License: AGPL-3.0-only
AuthorName: HunterEwok
WebSite: https://cbb.tools
SourceCode: https://github.com/HunterEwok/cbb
IssueTracker: https://github.com/HunterEwok/cbb/issues
Changelog: https://github.com/HunterEwok/cbb/blob/HEAD/CHANGELOG.md

AutoName: CBB
Name: "CBB: Copy Beyond Borders"

RepoType: git
Repo: https://github.com/HunterEwok/cbb.git
Binaries: https://github.com/HunterEwok/cbb/releases/download/v%v/cbb-fdroid-%v.apk

# The SHA-256 of the release key's certificate:
#   apksigner verify --print-certs cbb-fdroid-X.Y.Z.apk
AllowedAPKSigningKeys: RELEASE_CERTIFICATE_SHA256

Builds:
  - versionName: 0.6.0
    versionCode: 600
    commit: v0.6.0
    subdir: apps/android/app
    # Go for the tunnel's library (mobile/cbbtun); go.mod's toolchain line then fetches
    # the Go it names, checked against sum.golang.org, which Debian's Go leaves off.
    sudo:
      - apt-get update
      - apt-get install -y -t bookworm-backports golang-go
    # Rust for the core's library (ffi/), the version of cbb.rust in
    # apps/android/gradle.properties, with cargo-ndk.
    srclibs:
      - rustup@1.28.2
    # The Wear OS app and the full build's Google Play services, which the fdroid
    # flavor never uses.
    rm:
      - apps/android/wear
    prebuild:
      - sed -i -e '/play-services/d' build.gradle.kts
      - go env -w GOTOOLCHAIN=auto
      - $$rustup$$/rustup-init.sh -y --profile minimal --default-toolchain 1.99.0 --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - $HOME/.cargo/bin/cargo install --locked cargo-ndk@4.1.2
    output: build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
    # cbb.ndk in apps/android/gradle.properties, for the tunnel and the core.
    ndk: 30.0.16248370
    gradle:
      - fdroid

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: apps/android/version.properties|versionCode=(\d+)|apps/android/version.properties|versionName=(\S+)
CurrentVersion: 0.6.0
CurrentVersionCode: 600
