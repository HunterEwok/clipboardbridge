# clipboardbridge for tmux 3.2 or later. Copying in copy mode sends the selection
# to the group; prefix + ] pastes the first line of this member's clipboard
# text without its control characters and never a secret (cbb paste
# -terminal), as bracketed paste when the program asked for it. The paste
# helper takes the remote pastes that an admin sends this device, when its user
# turned remote paste on (cbb paste-receive on), into the pane in use.
set -s copy-command 'cbb copy'
bind-key ] run-shell -b 'cbb paste -terminal | tmux load-buffer -b clipboardbridge - && tmux paste-buffer -p -d -b clipboardbridge'
run-shell -b 'cbb paste-helper tmux'
