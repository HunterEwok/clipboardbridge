# clipbridge for tmux 3.2 or later. Copying in copy mode sends the selection
# to the group; prefix + ] pastes this member's clipboard text, as bracketed
# paste when the program asked for it, so a shell does not run a multi-line
# text by itself.
set -s copy-command 'clipbridge copy'
bind-key ] run-shell -b 'clipbridge paste | tmux load-buffer -b clipbridge - && tmux paste-buffer -p -d -b clipbridge'
