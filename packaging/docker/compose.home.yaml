# clipboardbridge as an always-on member at home, on a NAS or a home server:
#
#   docker compose -f compose.home.yaml up -d
#   docker exec -it clipboardbridge cbb pair
#
# It needs the host's network: mDNS and the member port must be on the home
# network, where Docker's bridge would hide them. The host's firewall stays
# the host's: let the home network reach TCP 8764 (CBB_PORT) and UDP 5353.
services:
  clipboardbridge:
    image: ghcr.io/hunterewok/clipboardbridge:latest # pin a release by its digest
    container_name: clipboardbridge
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /run/clipboardbridge:uid=65532,gid=65532,mode=0750
    volumes:
      - state:/var/lib/clipboardbridge
    # environment:
    #   CBB_PORT: "8764"

volumes:
  state:
