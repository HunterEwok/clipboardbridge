# OSV-Scanner: advisories that CI's advisories job lets pass, each with the reason
# and a date to look again. Reference: https://google.github.io/osv-scanner/configuration/

# Both come in with esp-hal, pinned to a git commit for the Nano ESP32 firmware
# (lite/esp32), and run only at build time on the build machine: paste is a
# proc macro, unsafe-libyaml reads esp-config's YAML in build scripts. Both are
# unmaintained, not vulnerable; they go when esp-hal drops them.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2027-04-25T00:00:00Z
reason = "paste is unmaintained; a proc macro of esp-hal, build time only"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0449"
ignoreUntil = 2027-04-25T00:00:00Z
reason = "unsafe-libyaml is unmaintained; esp-config's build scripts read YAML with it, build time only"

# block-buffer before 0.12.1 can be left with a bad cursor when the compression
# callback panics and the caller catches the panic and uses the buffer again.
# Nothing here can catch one: the lite member's release build aborts on a panic
# (lite/Cargo.toml), and the firmware has no unwinding at all. The 0.10 line
# comes with digest 0.10, through GotaTun (blake2, hmac) and esp-hal; it goes
# when they move to digest 0.11, which carries 0.12.
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-27T00:00:00Z
reason = "block-buffer 0.10 through GotaTun and esp-hal; panics abort, nothing catches one"
