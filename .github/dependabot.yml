# Dependabot: pull requests that update dependencies.
# Reference: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# GitHub Actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment.
# gomod covers the Go modules. The tools in go.mod (staticcheck, govulncheck, actionlint) are
# recorded as indirect requirements, which Dependabot skips by default, so they are allowed by
# name (until https://github.com/dependabot/dependabot-core/issues/12050 is fixed).
# cargo covers the lite member and the ESP32 firmware together: the firmware is its own
# workspace with its own Cargo.lock but builds core/ and embassy/ by path, so every
# update of their dependencies must change both lock files in one pull request (group-by
# dependency-name), or the firmware's `cargo build --locked` fails. esp-hal and its crates are
# pinned to a git commit on purpose and are left alone. gradle covers the Android app and its kit.
# npm covers only the checks of the website in CI (site/package.json).
# The cooldown waits a week after a release before proposing it, so a compromised release
# has time to be noticed and pulled.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    # The tray app (apps/desktop) is a module of its own, for Wails.
    directories: ["/", "/apps/desktop"]
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
      - dependency-name: "honnef.co/go/tools"
        dependency-type: "all"
      - dependency-name: "golang.org/x/vuln"
        dependency-type: "all"
      - dependency-name: "github.com/rhysd/actionlint"
        dependency-type: "all"
    ignore:
      # godbus 5.2 (up to 5.2.4) panics in its reading goroutine on a message with an array of
      # file descriptors (`ah`): the array is made of UnixFDIndex but filled with UnixFD. Any
      # peer on the session bus could stop the service that way, and the tests of the
      # FileTransfer portal do. Only the versions known to panic are skipped: a newer one comes
      # as a pull request, and CI's tests of the portal tell whether it decodes `ah` again.
      - dependency-name: "github.com/godbus/dbus/v5"
        versions: [">= 5.2.0, <= 5.2.4"]
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directories: ["/", "/esp32"]
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "esp-*"
      - dependency-name: "xtensa-lx*"
      # smoltcp follows embassy-net (embassy/): embassy-net 0.9 builds on smoltcp 0.13,
      # and a second copy of smoltcp beside it fails to build (both turn on features of the
      # `managed` crate). Lift this when embassy-net moves to a newer smoltcp.
      - dependency-name: "smoltcp"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # trouble-host 0.8 builds on bt-hci 0.10, while esp-radio's BLE controller (esp-hal's
      # pinned commit, and its main branch) implements bt-hci 0.9, so the firmware's Bluetooth
      # keyboard does not build with it. Only 0.8 is skipped: a newer one comes as a pull
      # request, and CI's firmware build tells whether it fits esp-radio by then.
      - dependency-name: "trouble-host"
        versions: ["0.8.x"]
    groups:
      cargo:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: "gradle"
    directory: "/apps/android"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      website-checks:
        patterns: ["*"]
