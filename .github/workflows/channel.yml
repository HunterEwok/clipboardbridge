# SPDX-License-Identifier: AGPL-3.0-only
# Keeps the release channel current (docs/maintaining.md, "Signed
# releases"): takes the stable.json that cbb.tools renews every week with
# the channel key into the branch channel, after checking it under the
# pinned roots, and opens an issue when keys.json or stable.json there is
# close to its expiry. It holds no key: cbb.tools signs, and GitHub only
# checks and copies.
name: channel

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: channel
  cancel-in-progress: false

jobs:
  channel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit to the branch channel
      issues: write # the reminder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the branch
        id: branch
        run: |
          if git ls-remote --exit-code origin refs/heads/channel >/dev/null; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "No branch channel yet: release-sign publish makes it with the first signed release."
          fi
      # This checkout keeps its token: the next steps push to the branch channel.
      # The job uploads no artifact, so nothing carries the token out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.branch.outputs.exists == 'true'
        with:
          ref: channel
          path: channel
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.branch.outputs.exists == 'true'
        with:
          go-version-file: go.mod
      - name: take the renewed stable.json
        if: steps.branch.outputs.exists == 'true'
        run: |
          go build -o "$RUNNER_TEMP/release-sign" ./tools/release-sign
          "$RUNNER_TEMP/release-sign" take channel
          cd channel
          if ! git diff --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -am "Take the renewed stable.json from cbb.tools"
            git push origin HEAD:channel
          fi
      - name: remind the maintainer
        # Also when taking failed: cbb.tools may be down.
        if: always() && steps.branch.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/release-sign" due channel >"$RUNNER_TEMP/due.md"
          [ -s "$RUNNER_TEMP/due.md" ] || exit 0
          cat "$RUNNER_TEMP/due.md"
          title="Release channel: renewal due"
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[].number')" ]; then
            printf '%s\n\n%s\n' "The branch channel needs the maintainer (docs/maintaining.md, \"Signed releases\"):" "$(cat "$RUNNER_TEMP/due.md")" >"$RUNNER_TEMP/issue.md"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue.md" --assignee HunterEwok
          fi
