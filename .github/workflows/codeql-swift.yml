# SPDX-License-Identifier: AGPL-3.0-only
# CodeQL code scanning of the iPhone app and its kit (Swift).
#
# Apart from codeql.yml because it is slow: CodeQL's Swift tracer makes the build take about
# 45 minutes. So it runs only when something under apps/ios changes, weekly for new queries
# on unchanged code, by hand (Actions → codeql-swift → Run workflow), and for each release:
# release.yml calls it and publishes only if it passes.
#
# GitHub's default setup builds only the kit's package, not the app, since the app's Xcode
# project is generated by xcodegen. Building the app compiles the kit too.
#
# Not required by the ruleset of main. Alerts show under Security → Code scanning.
name: codeql-swift

on:
  pull_request:
    paths:
      - apps/ios/**
      - .github/workflows/codeql-swift.yml
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - .github/workflows/codeql-swift.yml
  schedule:
    - cron: "17 4 * * 1" # weekly
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: generate the iPhone app's project and fetch its packages
        # Before CodeQL watches: Homebrew refuses to run under its tracer. The app
        # links the phones' tunnel (mobile/cbbtun), bound by gomobile, and the
        # Rust core (lite/ffi), which Rust builds.
        run: |
          mobile/cbbtun/bind.sh ios apps/ios/Cbbtun.xcframework
          sh lite/ffi/bind.sh ios apps/ios/CbbCore
          brew install xcodegen
          (cd apps/ios && xcodegen generate)
          xcodebuild -resolvePackageDependencies -project apps/ios/ClipboardBridge.xcodeproj -scheme ClipboardBridge
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: swift
          build-mode: manual
      - name: build the iPhone app and the kit
        # Unsigned, for the simulator.
        run: |
          set -o pipefail
          xcodebuild build -project apps/ios/ClipboardBridge.xcodeproj -scheme ClipboardBridge \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO | tail -n 50
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:swift
