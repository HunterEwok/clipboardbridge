# SPDX-License-Identifier: AGPL-3.0-only
# Builds a release from a version tag: an archive per platform, the lite
# member's archives, the Android app's and the Wear OS app's APKs, SHA256SUMS,
# the Linux and Windows installers and a build provenance attestation for each
# file, the Docker image on ghcr.io, the Homebrew formula for the tap and the
# winget manifest; with a certificate in the secrets, the signed Windows
# programs, and with the feed's key, the OpenWrt apk feed.
# It publishes only after the iPhone app's CodeQL analysis (codeql-swift.yml)
# passes on the tag, which takes about 45 minutes.
name: release

on:
  push:
    tags: ["v*"]
  # Run from a branch, it builds everything, the signed APK included, and
  # publishes nothing: a check that the release key in the secrets works.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.goos }}-${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64, name: amd64, runner: ubuntu-latest, cgo: "0", ext: tar.gz }
          - { goos: linux, goarch: arm64, name: arm64, runner: ubuntu-latest, cgo: "0", ext: tar.gz }
          - { goos: linux, goarch: arm, goarm: "7", name: armv7, runner: ubuntu-latest, cgo: "0", ext: tar.gz }
          - { goos: linux, goarch: arm, goarm: "6", name: armv6, runner: ubuntu-latest, cgo: "0", ext: tar.gz }
          # OpenWrt routers without an FPU take softfloat.
          - { goos: linux, goarch: mips, gomips: softfloat, name: mips, runner: ubuntu-latest, cgo: "0", ext: tar.gz }
          - { goos: linux, goarch: mipsle, gomips: softfloat, name: mipsle, runner: ubuntu-latest, cgo: "0", ext: tar.gz }
          - { goos: freebsd, goarch: amd64, name: amd64, runner: ubuntu-latest, cgo: "0", ext: tar.gz }
          - { goos: freebsd, goarch: arm64, name: arm64, runner: ubuntu-latest, cgo: "0", ext: tar.gz }
          # The Mac's pasteboard agent needs cgo, so the macOS targets are built on macOS.
          - { goos: darwin, goarch: arm64, name: arm64, runner: macos-latest, cgo: "1", ext: tar.gz }
          - { goos: darwin, goarch: amd64, name: amd64, runner: macos-latest, cgo: "1", ext: tar.gz }
          - { goos: windows, goarch: amd64, name: amd64, runner: ubuntu-latest, cgo: "0", ext: zip }
          - { goos: windows, goarch: arm64, name: arm64, runner: ubuntu-latest, cgo: "0", ext: zip }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      ARCHIVE: clipboardbridge-${{ matrix.goos }}-${{ matrix.name }}.${{ matrix.ext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from scratch
      - name: build
        run: |
          ldflags="-s -w -X github.com/HunterEwok/clipboardbridge/internal/version.Version=$GITHUB_REF_NAME"
          if [ "$GOOS" = windows ]; then
            # cbbw.exe is the same program without a console window, for the agent.
            go build -trimpath -ldflags "$ldflags" -o "$RUNNER_TEMP/cbb.exe" ./cmd/cbb
            go build -trimpath -ldflags "$ldflags -H=windowsgui" -o "$RUNNER_TEMP/cbbw.exe" ./cmd/cbb
          else
            go build -trimpath -ldflags "$ldflags" -o "$RUNNER_TEMP/cbb" ./cmd/cbb
          fi
      - name: sign the Windows programs (Authenticode), with a certificate in the secrets
        # A code signing certificate as a base64 PKCS#12 file and its password
        # (docs/maintaining.md, "Signing for Windows"); without them the
        # programs stay unsigned, as before.
        if: matrix.goos == 'windows'
        env:
          CERT_BASE64: ${{ secrets.CBB_WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CBB_WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_BASE64" ]; then
            echo "::warning::no CBB_WINDOWS_CERT_BASE64 in the secrets; cbb.exe and cbbw.exe are not signed"
            exit 0
          fi
          sudo apt-get install -y -qq osslsigncode >/dev/null
          cert="$RUNNER_TEMP/cert.pfx" pass="$RUNNER_TEMP/cert.pass"
          (umask 077 && printf '%s' "$CERT_BASE64" | base64 -d >"$cert" && printf '%s' "$CERT_PASSWORD" >"$pass")
          trap 'rm -f "$cert" "$pass"' EXIT
          for f in cbb.exe cbbw.exe; do
            osslsigncode sign -pkcs12 "$cert" -readpass "$pass" -h sha256 \
              -n clipboardbridge -i https://github.com/HunterEwok/clipboardbridge \
              -ts http://timestamp.digicert.com \
              -in "$RUNNER_TEMP/$f" -out "$RUNNER_TEMP/$f.signed"
            mv "$RUNNER_TEMP/$f.signed" "$RUNNER_TEMP/$f"
          done
      - name: the agent has the pasteboard
        if: matrix.goos == 'darwin'
        run: otool -L "$RUNNER_TEMP/cbb" | grep -q AppKit.framework
      - name: archive
        run: |
          bin=$RUNNER_TEMP/cbb
          if [ "$GOOS" = windows ]; then bin=$bin.exe; fi
          sh packaging/archive.sh "$bin" "$GOOS" "${{ matrix.name }}" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ runner.temp }}/dist/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  android:
    name: build (android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The app binds the phones' tunnel (mobile/cbbtun) with gomobile as it builds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from scratch
      - name: build the signed APK
        working-directory: apps/android
        # The release key lives in the repository's secrets (docs/apps.md, "Releasing the
        # Android app"); without it the release has no APK rather than an unsigned one.
        env:
          KEYSTORE_BASE64: ${{ secrets.CBB_ANDROID_KEYSTORE_BASE64 }}
          CBB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CBB_ANDROID_KEYSTORE_PASSWORD }}
          CBB_ANDROID_KEY_ALIAS: ${{ secrets.CBB_ANDROID_KEY_ALIAS }}
          CBB_ANDROID_KEY_PASSWORD: ${{ secrets.CBB_ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::no Android release key in the secrets; the release has no APK"
            exit 0
          fi
          export CBB_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$CBB_ANDROID_KEYSTORE"
          # A release's tag builds the version of apps/android/version.properties, which
          # F-Droid reads too, so the two must agree; a pre-release (v1.2.3-rc.1) passes its
          # own, and a run by hand from a branch builds 0.0.0-dev.
          version=${GITHUB_REF_NAME#v}
          if [ "$GITHUB_REF_TYPE" != tag ]; then version=0.0.0-dev; fi
          case $version in
          *-*)
            core=${version%%-*}
            major=${core%%.*}
            rest=${core#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            set -- -PversionName="$version" \
              -PversionCode=$((major * 10000 + minor * 100 + patch > 0 ? major * 10000 + minor * 100 + patch : 1))
            ;;
          *)
            file=$(sed -n 's/^versionName=//p' version.properties)
            if [ "$file" != "$version" ]; then
              echo "::error::apps/android/version.properties has $file, the tag is $GITHUB_REF_NAME"
              exit 1
            fi
            set --
            ;;
          esac
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(sed -n 's/^cbb.ndk=//p' gradle.properties)" >/dev/null </dev/null
          # The full build for GitHub and the fdroid one, which F-Droid builds again from the
          # tag and publishes with this signature when the two are the same (docs/apps.md, "F-Droid").
          ./gradlew --no-daemon :app:assembleFullRelease :app:assembleFdroidRelease :wear:assembleRelease "$@"
          rm -f "$CBB_ANDROID_KEYSTORE"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs app/build/outputs/apk/full/release/app-full-release.apk
          "$apksigner" verify --print-certs app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          "$apksigner" verify --print-certs wear/build/outputs/apk/release/wear-release.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk "$RUNNER_TEMP/dist/clipboardbridge-$version.apk"
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "$RUNNER_TEMP/dist/clipboardbridge-fdroid-$version.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "$RUNNER_TEMP/dist/clipboardbridge-wear-$version.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: ${{ runner.temp }}/dist/
          if-no-files-found: ignore
          retention-days: 1

  codeql-swift:
    # The iPhone app's CodeQL analysis must pass before a release; it runs on
    # pull requests only when the app changes.
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/codeql-swift.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  lite:
    name: build (clipboardbridge-lite-linux-${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, name: amd64 }
          - { target: aarch64-unknown-linux-musl, name: arm64 }
          - { target: arm-unknown-linux-musleabihf, name: armv6 }
    env:
      ARCHIVE: clipboardbridge-lite-linux-${{ matrix.name }}.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: build (static, linked with rust-lld; see lite/.cargo/config.toml)
        working-directory: lite
        run: CBB_VERSION="${GITHUB_REF_NAME#v}" cargo build --locked --release --target ${{ matrix.target }}
      - name: archive, with the crates' licenses and the installer
        run: sh lite/packaging/archive.sh lite/target/${{ matrix.target }}/release/cbb ${{ matrix.target }} ${{ matrix.name }} "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ runner.temp }}/dist/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  litemips:
    name: build (clipboardbridge-lite-linux-${{ matrix.name }}, no tunnel)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { target: mips-unknown-linux-musl, arch: mips, name: mips }
          - { target: mipsel-unknown-linux-musl, arch: mipsel, name: mipsle }
    env:
      ARCHIVE: clipboardbridge-lite-linux-${{ matrix.name }}.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nightly Rust with the standard library's source, and zig
        run: |
          rustup toolchain install nightly-2026-10-26 --profile minimal --component rust-src
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install -q ziglang==0.15.2 cargo-zigbuild==0.24.0
          echo "$RUNNER_TEMP/zig/bin" >>"$GITHUB_PATH"
      - name: build (static, soft float, without sync away from home; see lite/packaging/mips.sh)
        run: CBB_VERSION="${GITHUB_REF_NAME#v}" sh lite/packaging/mips.sh ${{ matrix.arch }}
      - name: archive, with the crates' licenses and the installer
        run: sh lite/packaging/archive.sh lite/target/${{ matrix.target }}/release/cbb ${{ matrix.target }} ${{ matrix.name }} "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ runner.temp }}/dist/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  openwrt-feed:
    # The apk feed for OpenWrt from the Linux archives above, signed with
    # the feed's ECDSA P-256 key (docs/maintaining.md, "The OpenWrt feed"),
    # as openwrt-feed.tar.gz, which goes to cbb.tools/openwrt/. Without the
    # key in the secrets there is no feed.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/dist
          pattern: clipboardbridge-linux-*
          merge-multiple: true
      - name: build and sign the feed in Alpine, whose apk has mkpkg
        env:
          FEED_KEY: ${{ secrets.CBB_OPENWRT_FEED_KEY }}
        run: |
          if [ -z "$FEED_KEY" ]; then
            echo "::warning::no CBB_OPENWRT_FEED_KEY in the secrets; no OpenWrt feed"
            exit 0
          fi
          key="$RUNNER_TEMP/key"
          mkdir -m 700 "$key" "$RUNNER_TEMP/feed"
          (umask 077 && printf '%s\n' "$FEED_KEY" >"$key/private.pem")
          trap 'rm -rf "$key"' EXIT
          docker run --rm -v "$RUNNER_TEMP/dist:/dist:ro" -v "$PWD:/src:ro" -v "$key:/key:ro" -v "$RUNNER_TEMP/feed:/feed" \
            alpine:3.23@sha256:3d67941fed5ae436b2bb9791cb3f50a252441c7706bbc5b4e738936df8ff8306 \
            sh /src/packaging/openwrt/feed.sh "$GITHUB_REF_NAME" /dist /feed /key/private.pem
          openssl ec -in "$key/private.pem" -pubout -out "$RUNNER_TEMP/feed/clipboardbridge.pem" 2>/dev/null
          mkdir -p "$RUNNER_TEMP/out"
          tar -czf "$RUNNER_TEMP/out/openwrt-feed.tar.gz" -C "$RUNNER_TEMP/feed" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwrt-feed.tar.gz
          path: ${{ runner.temp }}/out/openwrt-feed.tar.gz
          if-no-files-found: ignore
          retention-days: 1

  release:
    if: github.ref_type == 'tag'
    needs: [build, android, lite, litemips, codeql-swift, openwrt-feed]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cp packaging/get.sh packaging/windows/get.ps1 dist/
          cd dist
          set -- *.tar.gz *.zip get.sh get.ps1
          for f in *.apk; do [ -e "$f" ] && set -- "$@" "$f"; done
          sha256sum -- "$@" >SHA256SUMS
          cat SHA256SUMS
      - name: the winget manifest, from SHA256SUMS
        # For winget's repository, published with the release, which is
        # immutable once published; it goes to microsoft/winget-pkgs by a pull
        # request (docs/maintaining.md, "winget"). A pre-release stays out, as
        # it does from the tap.
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          out="$RUNNER_TEMP/winget"
          sh packaging/winget/manifest.sh "$GITHUB_REF_NAME" dist/SHA256SUMS "$out"
          (cd "$out" && zip -qX "$GITHUB_WORKSPACE/dist/winget-manifest.zip" ./*.yaml)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case $GITHUB_REF_NAME in *-*) prerelease=--prerelease ;; esac
          # shellcheck disable=SC2086 # $prerelease is one word or none
          # Our notes first (packaging/release-notes.sh), then GitHub's list
          # of the merged pull requests.
          sh packaging/release-notes.sh "$GITHUB_REF_NAME" >"$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "clipboardbridge $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes --verify-tag $prerelease

  docker:
    # The image of packaging/docker, from the release's own Linux archives, so
    # it holds the binaries the release attests.
    if: github.ref_type == 'tag'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the image's digest in the release notes
      packages: write # push the image
      id-token: write # sign the attestation
      attestations: write
    env:
      IMAGE: ghcr.io/hunterewok/clipboardbridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: clipboardbridge-linux-*
          path: dist
          merge-multiple: true
      - name: the build context
        run: |
          for a in amd64 arm64 armv7; do
            mkdir -p "$RUNNER_TEMP/$a"
            tar -xzf "dist/clipboardbridge-linux-$a.tar.gz" -C "$RUNNER_TEMP/$a"
          done
          t=$RUNNER_TEMP
          sh packaging/docker/context.sh "$t/image" amd64="$t/amd64/clipboardbridge/cbb" arm64="$t/arm64/clipboardbridge/cbb" \
            armv7="$t/armv7/clipboardbridge/cbb" notices="$t/amd64/clipboardbridge/THIRD_PARTY_NOTICES"
      - name: build and push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --name cbb >/dev/null
          version=${GITHUB_REF_NAME#v}
          set -- -t "$IMAGE:$version"
          case $GITHUB_REF_NAME in *-*) ;; *) set -- "$@" -t "$IMAGE:latest" ;; esac
          # The attestation below is GitHub's; buildx's own would add a platform
          # "unknown" to the index, which confuses some NAS systems.
          docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
            "$@" --push --metadata-file "$RUNNER_TEMP/meta.json" "$RUNNER_TEMP/image"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")
          case $digest in sha256:*) ;; *) echo "no digest in the build's metadata" >&2; exit 1 ;; esac
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: the digest in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body >"$RUNNER_TEMP/notes.md"
          # shellcheck disable=SC2016 # the backticks are Markdown, not a command
          printf '\n## Docker\n\n```\n%s@%s\n```\n\nPin the image by this digest (packaging/docker/README.md).\n' "$IMAGE" "$DIGEST" >>"$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"

  homebrew:
    # A pre-release stays out of the tap, as it stays out of releases/latest.
    # Run from a branch, it only checks that the key in the secrets may push
    # to the tap, with git push --dry-run.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (needs.release.result == 'success' && !contains(github.ref_name, '-')))
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the formula, from the published SHA256SUMS
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          sh packaging/homebrew/formula.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS" >"$RUNNER_TEMP/clipboardbridge.rb"
          cat "$RUNNER_TEMP/clipboardbridge.rb"
      - name: push it to the tap
        # A deploy key with write access to the tap repository only
        # (docs/maintaining.md, "Homebrew"); without it the tap keeps its formula.
        env:
          TAP_KEY: ${{ secrets.CBB_HOMEBREW_TAP_KEY }}
        run: |
          if [ -z "$TAP_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" != tag ]; then
              echo "::error::no CBB_HOMEBREW_TAP_KEY in the secrets"
              exit 1
            fi
            echo "::warning::no CBB_HOMEBREW_TAP_KEY in the secrets; the Homebrew tap keeps its formula"
            exit 0
          fi
          key="$RUNNER_TEMP/tap-key"
          (umask 077 && printf '%s\n' "$TAP_KEY" >"$key")
          trap 'rm -f "$key"' EXIT
          # GitHub's host keys, from its API over TLS.
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >"$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          tap="$RUNNER_TEMP/tap"
          git clone --depth 1 git@github.com:HunterEwok/homebrew-tap.git "$tap"
          mkdir -p "$tap/Formula"
          dry=
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            # A stand-in that never leaves the runner.
            echo "# a check of the deploy key" >"$tap/Formula/clipboardbridge.rb"
            dry=--dry-run
          else
            cp "$RUNNER_TEMP/clipboardbridge.rb" "$tap/Formula/clipboardbridge.rb"
          fi
          cd "$tap"
          git add Formula/clipboardbridge.rb
          if git diff --cached --quiet; then
            echo "The tap has this formula already."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "clipboardbridge $GITHUB_REF_NAME"
          # shellcheck disable=SC2086 # $dry is one word or none
          git push $dry origin HEAD:main
