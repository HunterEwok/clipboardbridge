# SPDX-License-Identifier: AGPL-3.0-only
# Builds a release from a version tag: an archive per platform, SHA256SUMS,
# the Linux installer and a build provenance attestation for each file.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.goos }}-${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64, name: amd64, runner: ubuntu-latest, cgo: "0" }
          - { goos: linux, goarch: arm64, name: arm64, runner: ubuntu-latest, cgo: "0" }
          - { goos: linux, goarch: arm, goarm: "7", name: armv7, runner: ubuntu-latest, cgo: "0" }
          - { goos: linux, goarch: arm, goarm: "6", name: armv6, runner: ubuntu-latest, cgo: "0" }
          # The Mac's pasteboard agent needs cgo, so the macOS targets are built on macOS.
          - { goos: darwin, goarch: arm64, name: arm64, runner: macos-latest, cgo: "1" }
          - { goos: darwin, goarch: amd64, name: amd64, runner: macos-latest, cgo: "1" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      ARCHIVE: clipbridge-${{ matrix.goos }}-${{ matrix.name }}.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from scratch
      - name: build
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/HunterEwok/clipbridge/internal/version.Version=$GITHUB_REF_NAME" \
            -o "$RUNNER_TEMP/clipbridge" ./cmd/clipbridge
      - name: the agent has the pasteboard
        if: matrix.goos == 'darwin'
        run: otool -L "$RUNNER_TEMP/clipbridge" | grep -q AppKit.framework
      - name: archive
        run: sh packaging/archive.sh "$RUNNER_TEMP/clipbridge" "$GOOS" "${{ matrix.name }}" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ runner.temp }}/dist/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cp packaging/linux/get.sh dist/
          cd dist
          sha256sum -- *.tar.gz get.sh >SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case $GITHUB_REF_NAME in *-*) prerelease=--prerelease ;; esac
          # shellcheck disable=SC2086 # $prerelease is one word or none
          # Our notes first (packaging/release-notes.sh), then GitHub's list
          # of the merged pull requests.
          sh packaging/release-notes.sh "$GITHUB_REF_NAME" >"$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "clipbridge $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes --verify-tag $prerelease
