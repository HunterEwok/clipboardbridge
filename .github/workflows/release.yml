# SPDX-License-Identifier: AGPL-3.0-only
# Builds a release from a version tag: an archive per platform, the lite
# member's archives, the Android app's and the Wear OS app's APKs, with the
# Developer ID certificates the Mac's .pkg (CBB.app and the service) and the
# iPhone app's build for TestFlight, SHA256SUMS,
# the Linux and Windows installers, a software bill of materials for each part
# (tools/sbom) and a build provenance attestation for each file, the Docker
# image on ghcr.io with its bill of materials and the winget manifest; with a
# certificate in the secrets, the signed Windows programs, and with the
# feed's key, the OpenWrt apk feed.
# It makes a draft release, only after the iPhone app's CodeQL analysis
# (codeql-swift.yml) passes on the tag, which takes about 45 minutes. The
# maintainer signs and publishes it with release-sign publish; published.yml
# then updates the Homebrew tap.
name: release

on:
  push:
    tags: ["v*"]
  # Run by hand from main, it builds everything, the signed APK included, and
  # makes no release: a check that the release keys in the secrets work. The
  # environment release gives its secrets only to main and the tags v*.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.goos }}-${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # The tray app needs cgo with GTK 4 and WebKitGTK, so it is built on a
          # runner of its own architecture, for amd64 and arm64.
          - { goos: linux, goarch: amd64, name: amd64, runner: ubuntu-latest, cgo: "0", ext: tar.gz, tray: true }
          - { goos: linux, goarch: arm64, name: arm64, runner: ubuntu-24.04-arm, cgo: "0", ext: tar.gz, tray: true }
          - { goos: linux, goarch: arm, goarm: "7", name: armv7, runner: ubuntu-latest, cgo: "0", ext: tar.gz }
          - { goos: linux, goarch: arm, goarm: "6", name: armv6, runner: ubuntu-latest, cgo: "0", ext: tar.gz }
          # OpenWrt routers without an FPU take softfloat.
          - { goos: linux, goarch: mips, gomips: softfloat, name: mips, runner: ubuntu-latest, cgo: "0", ext: tar.gz }
          - { goos: linux, goarch: mipsle, gomips: softfloat, name: mipsle, runner: ubuntu-latest, cgo: "0", ext: tar.gz }
          - { goos: freebsd, goarch: amd64, name: amd64, runner: ubuntu-latest, cgo: "0", ext: tar.gz }
          - { goos: freebsd, goarch: arm64, name: arm64, runner: ubuntu-latest, cgo: "0", ext: tar.gz }
          # The Mac's pasteboard agent needs cgo, so the macOS targets are built on macOS.
          - { goos: darwin, goarch: arm64, name: arm64, runner: macos-latest, cgo: "1", ext: tar.gz }
          - { goos: darwin, goarch: amd64, name: amd64, runner: macos-latest, cgo: "1", ext: tar.gz }
          - { goos: windows, goarch: amd64, name: amd64, runner: ubuntu-latest, cgo: "0", ext: zip }
          - { goos: windows, goarch: arm64, name: arm64, runner: ubuntu-latest, cgo: "0", ext: zip }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # The Windows certificate's secrets live in the environment release, which
    # only release tags and main may use (docs/maintaining.md, "Release secrets").
    environment: release
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
      ARCHIVE: cbb-${{ matrix.goos }}-${{ matrix.name }}.${{ matrix.ext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from scratch
      - name: the Rust core as WebAssembly, which cbb runs for the group's rules (internal/core)
        run: |
          CBB_SOURCE="$GITHUB_SHA" sh wasm/build.sh
          sh member/packaging/notices.sh wasm32-unknown-unknown cbb-wasm >"$RUNNER_TEMP/core-notices"
      - name: build
        run: |
          ldflags="-s -w -X github.com/HunterEwok/cbb/internal/version.Version=$GITHUB_REF_NAME"
          # Every release build runs the Rust core under wazero, never Go's
          # own rules, which only the tests use.
          overlay=$GITHUB_WORKSPACE/target/cbb-core-overlay.json
          if [ "$GOOS" = windows ]; then
            # cbbw.exe is the same program without a console window, for the agent.
            go build -overlay "$overlay" -tags cbbwasm -trimpath -ldflags "$ldflags" -o "$RUNNER_TEMP/cbb.exe" ./cmd/cbb
            go build -overlay "$overlay" -tags cbbwasm -trimpath -ldflags "$ldflags -H=windowsgui" -o "$RUNNER_TEMP/cbbw.exe" ./cmd/cbb
            # The tray app, a module of its own; on Windows it needs no cgo.
            (cd apps/desktop && go build -trimpath -ldflags "-s -w -H=windowsgui" -o "$RUNNER_TEMP/cbb-desktop.exe" .)
          else
            go build -overlay "$overlay" -tags cbbwasm -trimpath -ldflags "$ldflags" -o "$RUNNER_TEMP/cbb" ./cmd/cbb
          fi
          for f in "$RUNNER_TEMP"/cbb "$RUNNER_TEMP"/cbb.exe "$RUNNER_TEMP"/cbbw.exe; do
            [ ! -f "$f" ] || go version -m "$f" | grep -q -- '-tags=cbbwasm'
          done
      - name: the tray app for Linux
        if: matrix.tray
        env:
          CGO_ENABLED: "1"
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
          cd apps/desktop
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/cbb-desktop" .
      - name: sign the Windows programs (Authenticode), with a certificate in the secrets
        # A code signing certificate as a base64 PKCS#12 file and its password
        # (docs/maintaining.md, "Signing for Windows"); without them the
        # programs stay unsigned, as before.
        if: matrix.goos == 'windows'
        env:
          CERT_BASE64: ${{ secrets.CBB_WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CBB_WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_BASE64" ]; then
            echo "::warning::no CBB_WINDOWS_CERT_BASE64 in the secrets; the Windows programs are not signed"
            exit 0
          fi
          sudo apt-get install -y -qq osslsigncode >/dev/null
          cert="$RUNNER_TEMP/cert.pfx" pass="$RUNNER_TEMP/cert.pass"
          (umask 077 && printf '%s' "$CERT_BASE64" | base64 -d >"$cert" && printf '%s' "$CERT_PASSWORD" >"$pass")
          trap 'rm -f "$cert" "$pass"' EXIT
          for f in cbb.exe cbbw.exe cbb-desktop.exe; do
            osslsigncode sign -pkcs12 "$cert" -readpass "$pass" -h sha256 \
              -n cbb -i https://github.com/HunterEwok/cbb \
              -ts http://timestamp.digicert.com \
              -in "$RUNNER_TEMP/$f" -out "$RUNNER_TEMP/$f.signed"
            mv "$RUNNER_TEMP/$f.signed" "$RUNNER_TEMP/$f"
          done
      - name: the agent has the pasteboard
        if: matrix.goos == 'darwin'
        run: otool -L "$RUNNER_TEMP/cbb" | grep -q AppKit.framework
      - name: sign cbb with the Developer ID and notarize it, with the certificate in the secrets
        # The Developer ID Application certificate as a base64 PKCS#12 file and
        # its password, and the App Store Connect API key that notarytool signs
        # in with (docs/maintaining.md, "Signing for macOS"); without them cbb
        # is signed ad hoc, as before, and Gatekeeper asks before it first runs.
        if: matrix.goos == 'darwin'
        env:
          P12: ${{ secrets.CBB_APPLE_DEVID_APP_P12 }}
          P12_PASSWORD: ${{ secrets.CBB_APPLE_DEVID_APP_PASSWORD }}
          ASC_KEY: ${{ secrets.CBB_ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.CBB_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CBB_ASC_ISSUER_ID }}
        run: |
          if [ -z "$P12" ] || [ -z "$ASC_KEY" ]; then
            echo "::warning::no CBB_APPLE_DEVID_APP_P12 or CBB_ASC_KEY in the secrets; cbb for macOS is not signed with the Developer ID"
            sh packaging/macos/sign.sh - "$RUNNER_TEMP/cbb"
            exit 0
          fi
          sh packaging/macos/keychain.sh create "$RUNNER_TEMP/signing"
          trap 'sh packaging/macos/keychain.sh delete "$RUNNER_TEMP/signing"' EXIT
          id=$(sh packaging/macos/keychain.sh import "$RUNNER_TEMP/signing" "Developer ID Application" U2ZJ8F2JCJ)
          sh packaging/macos/sign.sh "$id" "$RUNNER_TEMP/cbb"
          sh packaging/macos/notarize.sh "$RUNNER_TEMP/cbb"
      - name: archive
        run: |
          bin=$RUNNER_TEMP/cbb
          if [ "$GOOS" = windows ]; then bin=$bin.exe; fi
          CORE_NOTICES=$RUNNER_TEMP/core-notices sh packaging/archive.sh "$bin" "$GOOS" "${{ matrix.name }}" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ runner.temp }}/dist/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  macos-app:
    name: build (the Mac app and the .pkg)
    needs: [build]
    runs-on: macos-latest
    timeout-minutes: 60
    # The Developer ID certificates and the App Store Connect key live in the
    # environment release (docs/maintaining.md, "Signing for macOS").
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cbb-darwin-*
          path: ${{ runner.temp }}/darwin
          merge-multiple: true
      - name: cbb for Apple silicon and Intel in one program, from the signed builds
        run: |
          cd "$RUNNER_TEMP/darwin"
          for a in arm64 amd64; do
            mkdir "$a"
            tar -xzf "cbb-darwin-$a.tar.gz" -C "$a"
          done
          # Each slice keeps the signature (and notarization) of its own build.
          lipo -create arm64/cbb/cbb amd64/cbb/cbb -output "$RUNNER_TEMP/cbb"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/cbb"
          "$RUNNER_TEMP/cbb" version
      - name: build CBB.app for Apple silicon and Intel
        working-directory: apps/macos
        run: |
          set -o pipefail
          # The app's version is the tag's numbers (CFBundleShortVersionString has
          # no -rc.1), the build number the run's; a run by hand from main is 0.0.0.
          version=${GITHUB_REF_NAME#v}
          if [ "$GITHUB_REF_TYPE" != tag ]; then version=0.0.0-dev; fi
          echo "VERSION=$version" >>"$GITHUB_ENV"
          brew install xcodegen
          xcodegen generate
          # Unsigned here; sign.sh signs it below with the hardened runtime.
          xcodebuild build -project CBBMac.xcodeproj -scheme CBBMac -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/derived" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${version%%-*}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO | tail -n 50
          ditto "$RUNNER_TEMP/derived/Build/Products/Release/CBB.app" "$RUNNER_TEMP/CBB.app"
          lipo -archs "$RUNNER_TEMP/CBB.app/Contents/MacOS/CBB" | grep -q arm64
          lipo -archs "$RUNNER_TEMP/CBB.app/Contents/MacOS/CBB" | grep -q x86_64
      - name: sign and notarize CBB.app, and the .pkg with the Developer ID Installer
        # Without the certificates and the key in the secrets, the app is
        # signed ad hoc and the package is unsigned, and neither is in the release.
        env:
          APP_P12: ${{ secrets.CBB_APPLE_DEVID_APP_P12 }}
          APP_P12_PASSWORD: ${{ secrets.CBB_APPLE_DEVID_APP_PASSWORD }}
          INSTALLER_P12: ${{ secrets.CBB_APPLE_DEVID_INSTALLER_P12 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.CBB_APPLE_DEVID_INSTALLER_PASSWORD }}
          ASC_KEY: ${{ secrets.CBB_ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.CBB_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CBB_ASC_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          pkg="$RUNNER_TEMP/dist/cbb-$VERSION.pkg"
          if [ -z "$APP_P12" ] || [ -z "$INSTALLER_P12" ] || [ -z "$ASC_KEY" ]; then
            echo "::warning::no Developer ID certificates or CBB_ASC_KEY in the secrets; the release has no .pkg"
            sh packaging/macos/sign.sh - "$RUNNER_TEMP/CBB.app"
            sh packaging/macos/pkg.sh "$VERSION" "$RUNNER_TEMP/cbb" "$RUNNER_TEMP/CBB.app" "$RUNNER_TEMP/unsigned.pkg"
            exit 0
          fi
          sh packaging/macos/keychain.sh create "$RUNNER_TEMP/signing"
          trap 'sh packaging/macos/keychain.sh delete "$RUNNER_TEMP/signing"' EXIT
          app_id=$(P12=$APP_P12 P12_PASSWORD=$APP_P12_PASSWORD \
            sh packaging/macos/keychain.sh import "$RUNNER_TEMP/signing" "Developer ID Application" U2ZJ8F2JCJ)
          installer_id=$(P12=$INSTALLER_P12 P12_PASSWORD=$INSTALLER_P12_PASSWORD \
            sh packaging/macos/keychain.sh import "$RUNNER_TEMP/signing" "Developer ID Installer" U2ZJ8F2JCJ)
          sh packaging/macos/sign.sh "$app_id" "$RUNNER_TEMP/CBB.app"
          # The app's own ticket, for a copy of it outside the package.
          sh packaging/macos/notarize.sh "$RUNNER_TEMP/CBB.app"
          sh packaging/macos/pkg.sh "$VERSION" "$RUNNER_TEMP/cbb" "$RUNNER_TEMP/CBB.app" "$pkg" "$installer_id"
          sh packaging/macos/notarize.sh "$pkg"
          spctl --assess --type install --verbose=2 "$pkg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-pkg
          path: ${{ runner.temp }}/dist/
          if-no-files-found: ignore
          retention-days: 1

  testflight:
    name: build (the iPhone app, to TestFlight)
    runs-on: macos-latest
    timeout-minutes: 60
    # The Apple Distribution certificate, the App Store profiles and the App
    # Store Connect key live in the environment release (docs/maintaining.md,
    # "Signing for macOS"). A tag uploads the build to TestFlight; a run by
    # hand from main only builds and signs it.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from scratch
      - name: bind the phones' tunnel and build the Rust core, which the app links
        run: |
          mobile/cbbtun/bind.sh ios apps/ios/Cbbtun.xcframework
          sh ffi/bind.sh ios apps/ios/CbbCore
      - name: generate the Xcode project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: sign the app for the App Store and upload it to TestFlight
        env:
          P12: ${{ secrets.CBB_APPLE_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.CBB_APPLE_DISTRIBUTION_PASSWORD }}
          PROFILES: ${{ secrets.CBB_APPLE_PROFILES }}
          ASC_KEY: ${{ secrets.CBB_ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.CBB_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CBB_ASC_ISSUER_ID }}
        run: |
          if [ -z "$P12" ] || [ -z "$PROFILES" ] || [ -z "$ASC_KEY" ]; then
            echo "::warning::no CBB_APPLE_DISTRIBUTION_P12, CBB_APPLE_PROFILES or CBB_ASC_KEY in the secrets; no TestFlight build"
            exit 0
          fi
          sh packaging/macos/keychain.sh create "$RUNNER_TEMP/signing"
          trap 'sh packaging/macos/keychain.sh delete "$RUNNER_TEMP/signing"' EXIT
          sh packaging/macos/keychain.sh import "$RUNNER_TEMP/signing" "Apple Distribution" U2ZJ8F2JCJ >/dev/null
          version=${GITHUB_REF_NAME#v}
          upload=upload
          if [ "$GITHUB_REF_TYPE" != tag ]; then version=0.0.0 upload=; fi
          # The run's number grows with every run of this workflow, so each
          # upload has a higher build number than the one before.
          # shellcheck disable=SC2086 # $upload is one word or none
          KEYCHAIN="$RUNNER_TEMP/signing/cbb.keychain-db" \
            sh apps/ios/testflight.sh "$version" "$GITHUB_RUN_NUMBER" "$RUNNER_TEMP/ios" $upload

  android:
    name: build (android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release # the Android release key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The app binds the phones' tunnel (mobile/cbbtun) with gomobile as it builds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from scratch
      - name: build the signed APK
        working-directory: apps/android
        # The release key lives in the environment release's secrets (docs/apps.md, "Releasing the
        # Android app"); without it the release has no APK rather than an unsigned one.
        env:
          KEYSTORE_BASE64: ${{ secrets.CBB_ANDROID_KEYSTORE_BASE64 }}
          CBB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CBB_ANDROID_KEYSTORE_PASSWORD }}
          CBB_ANDROID_KEY_ALIAS: ${{ secrets.CBB_ANDROID_KEY_ALIAS }}
          CBB_ANDROID_KEY_PASSWORD: ${{ secrets.CBB_ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::no Android release key in the secrets; the release has no APK"
            exit 0
          fi
          export CBB_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$CBB_ANDROID_KEYSTORE"
          # A release's tag builds the version of apps/android/version.properties, which
          # F-Droid reads too, so the two must agree; a pre-release (v1.2.3-rc.1) passes its
          # own, and a run by hand from main builds 0.0.0-dev.
          version=${GITHUB_REF_NAME#v}
          if [ "$GITHUB_REF_TYPE" != tag ]; then version=0.0.0-dev; fi
          case $version in
          *-*)
            core=${version%%-*}
            major=${core%%.*}
            rest=${core#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            set -- -PversionName="$version" \
              -PversionCode=$((major * 10000 + minor * 100 + patch > 0 ? major * 10000 + minor * 100 + patch : 1))
            ;;
          *)
            file=$(sed -n 's/^versionName=//p' version.properties)
            if [ "$file" != "$version" ]; then
              echo "::error::apps/android/version.properties has $file, the tag is $GITHUB_REF_NAME"
              exit 1
            fi
            set --
            ;;
          esac
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(sed -n 's/^cbb.ndk=//p' gradle.properties)" >/dev/null </dev/null
          # The Rust the core's libraries are built with (ffi/), and cargo-ndk.
          rustup toolchain install "$(sed -n 's/^cbb.rust=//p' gradle.properties)" --profile minimal \
            --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          cargo install --locked cargo-ndk@4.1.2
          # The full build for GitHub and the fdroid one, which F-Droid builds again from the
          # tag and publishes with this signature when the two are the same (docs/apps.md, "F-Droid").
          ./gradlew --no-daemon :app:assembleFullRelease :app:assembleFdroidRelease :wear:assembleRelease "$@"
          rm -f "$CBB_ANDROID_KEYSTORE"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs app/build/outputs/apk/full/release/app-full-release.apk
          "$apksigner" verify --print-certs app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          "$apksigner" verify --print-certs wear/build/outputs/apk/release/wear-release.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk "$RUNNER_TEMP/dist/cbb-$version.apk"
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "$RUNNER_TEMP/dist/cbb-fdroid-$version.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "$RUNNER_TEMP/dist/cbb-wear-$version.apk"
          # What the three are built from (tools/sbom); the Rust core and the Go
          # tunnel inside them are in the release's other bills of materials.
          ./gradlew --no-daemon --no-configuration-cache --init-script ../../packaging/sbom.init.gradle.kts \
            -Pcbb.sbom.configs=fullReleaseRuntimeClasspath,fdroidReleaseRuntimeClasspath,releaseRuntimeClasspath :app:cbbSbom :wear:cbbSbom
          (cd ../.. && go run ./tools/sbom gradle -o "$RUNNER_TEMP/dist/sbom-android.cdx.json" -version "$version" apps/android/build/sbom/*.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: ${{ runner.temp }}/dist/
          if-no-files-found: ignore
          retention-days: 1

  codeql-swift:
    # The iPhone app's CodeQL analysis must pass before a release; it runs on
    # pull requests only when the app changes.
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/codeql-swift.yml # zizmor: ignore[self-repository]
    permissions:
      actions: read
      contents: read
      security-events: write

  lite:
    name: build (cbb-lite-linux-${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, name: amd64 }
          - { target: aarch64-unknown-linux-musl, name: arm64 }
          - { target: arm-unknown-linux-musleabihf, name: armv6 }
    env:
      ARCHIVE: cbb-lite-linux-${{ matrix.name }}.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: build (static, linked with rust-lld; see .cargo/config.toml)
        run: CBB_VERSION="${GITHUB_REF_NAME#v}" CBB_SOURCE="$GITHUB_SHA" cargo build --locked --release --target ${{ matrix.target }}
      - name: archive, with the crates' licenses and the installer
        run: sh member/packaging/archive.sh target/${{ matrix.target }}/release/cbb ${{ matrix.target }} ${{ matrix.name }} "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ runner.temp }}/dist/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  litemips:
    name: build (cbb-lite-linux-${{ matrix.name }}, no tunnel)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { target: mips-unknown-linux-musl, arch: mips, name: mips }
          - { target: mipsel-unknown-linux-musl, arch: mipsel, name: mipsle }
    env:
      ARCHIVE: cbb-lite-linux-${{ matrix.name }}.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nightly Rust with the standard library's source, and zig
        run: |
          rustup toolchain install nightly-2026-10-26 --profile minimal --component rust-src
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install -q ziglang==0.15.2 cargo-zigbuild==0.24.0
          echo "$RUNNER_TEMP/zig/bin" >>"$GITHUB_PATH"
      - name: build (static, soft float, without sync away from home; see member/packaging/mips.sh)
        run: CBB_VERSION="${GITHUB_REF_NAME#v}" CBB_SOURCE="$GITHUB_SHA" sh member/packaging/mips.sh ${{ matrix.arch }}
      - name: archive, with the crates' licenses and the installer
        run: sh member/packaging/archive.sh target/${{ matrix.target }}/release/cbb ${{ matrix.target }} ${{ matrix.name }} "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ runner.temp }}/dist/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  openwrt-feed:
    # The apk feed for OpenWrt from the Linux archives above, signed with
    # the feed's ECDSA P-256 key (docs/maintaining.md, "The OpenWrt feed"),
    # as openwrt-feed.tar.gz, which goes to cbb.tools/openwrt/. Without the
    # key in the secrets there is no feed.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release # the feed's key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/dist
          pattern: cbb-linux-*
          merge-multiple: true
      - name: build and sign the feed in Alpine, whose apk has mkpkg
        env:
          FEED_KEY: ${{ secrets.CBB_OPENWRT_FEED_KEY }}
        run: |
          if [ -z "$FEED_KEY" ]; then
            echo "::warning::no CBB_OPENWRT_FEED_KEY in the secrets; no OpenWrt feed"
            exit 0
          fi
          key="$RUNNER_TEMP/key"
          mkdir -m 700 "$key" "$RUNNER_TEMP/feed"
          (umask 077 && printf '%s\n' "$FEED_KEY" >"$key/private.pem")
          trap 'rm -rf "$key"' EXIT
          # A run by hand from main builds the feed as v0.0.0-rc.1, as CI's
          # openwrt job does: apk takes no version named after a branch.
          tag=$GITHUB_REF_NAME
          if [ "$GITHUB_REF_TYPE" != tag ]; then tag=v0.0.0-rc.1; fi
          docker run --rm -v "$RUNNER_TEMP/dist:/dist:ro" -v "$PWD:/src:ro" -v "$key:/key:ro" -v "$RUNNER_TEMP/feed:/feed" \
            alpine:3.23@sha256:3d67941fed5ae436b2bb9791cb3f50a252441c7706bbc5b4e738936df8ff8306 \
            sh /src/packaging/openwrt/feed.sh "$tag" /dist /feed /key/private.pem
          openssl ec -in "$key/private.pem" -pubout -out "$RUNNER_TEMP/feed/cbb.pem" 2>/dev/null
          mkdir -p "$RUNNER_TEMP/out"
          tar -czf "$RUNNER_TEMP/out/openwrt-feed.tar.gz" -C "$RUNNER_TEMP/feed" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwrt-feed.tar.gz
          path: ${{ runner.temp }}/out/openwrt-feed.tar.gz
          if-no-files-found: ignore
          retention-days: 1

  zxnext:
    # The ZX Spectrum Next's files, laid out for cbb.tools (packaging/zxnext/site.sh),
    # with the Pi Zero's lite member from the lite job.
    name: build (cbb-zxnext)
    needs: lite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      Z88DK: "2.3"
      Z88DK_SHA256: e08887ef9344f8dbd9d669bb904e17c35290a316bb1fe8b02c1a45b0d291292f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: z88dk from its source (no cache in a release; about 8 minutes)
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flex libxml2-dev libgmp-dev libboost-dev texinfo dos2unix
          curl -fsSL --retry 3 -o z88dk.tgz "https://github.com/z88dk/z88dk/releases/download/v$Z88DK/z88dk-src-$Z88DK.tgz"
          echo "$Z88DK_SHA256  z88dk.tgz" | sha256sum -c -
          tar xzf z88dk.tgz
          cd z88dk && ./build.sh -k -p zxn
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cbb-lite-linux-armv6.tar.gz
          path: ${{ runner.temp }}/lite
      - name: the dot command and the driver, with the SHA-256 of the Pi's cbb
        working-directory: apps/zxnext
        run: |
          tar -xzf "$RUNNER_TEMP/lite/cbb-lite-linux-armv6.tar.gz" -C "$RUNNER_TEMP/lite"
          export PATH="$RUNNER_TEMP/z88dk/bin:$PATH" ZCCCFG="$RUNNER_TEMP/z88dk/lib/config"
          make PI_CBB="$RUNNER_TEMP/lite/cbb-lite/cbb"
      - name: the files for cbb.tools
        run: |
          sh packaging/zxnext/site.sh apps/zxnext/build "$RUNNER_TEMP/lite/cbb-lite/cbb" "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/dist"
          tar -czf "$RUNNER_TEMP/dist/cbb-zxnext.tar.gz" -C "$RUNNER_TEMP/site" zxnext
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbb-zxnext.tar.gz
          path: ${{ runner.temp }}/dist/cbb-zxnext.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.ref_type == 'tag'
    needs: [build, macos-app, android, lite, litemips, zxnext, codeql-swift, openwrt-feed]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from scratch
      - name: the software bills of materials (tools/sbom, docs/maintaining.md)
        # The Go programs' modules from the programs themselves; the crates of
        # the lite member and of the phones' Rust core on their targets; the
        # Swift kit's packages. The Android apps' came with their APKs.
        run: |
          go run ./tools/sbom go -o dist/sbom-go.cdx.json -version "$GITHUB_REF_NAME" \
            dist/cbb-linux-*.tar.gz dist/cbb-darwin-*.tar.gz \
            dist/cbb-freebsd-*.tar.gz dist/cbb-windows-*.zip
          go run ./tools/sbom cargo -o dist/sbom-lite.cdx.json -version "$GITHUB_REF_NAME" -manifest Cargo.toml \
            -package cbb-lite \
            -target x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,arm-unknown-linux-musleabihf,mips-unknown-linux-musl,mipsel-unknown-linux-musl
          go run ./tools/sbom cargo -o dist/sbom-phone-core.cdx.json -version "$GITHUB_REF_NAME" -manifest Cargo.toml \
            -package cbb-ffi \
            -target aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          go run ./tools/sbom swift -o dist/sbom-ios-kit.cdx.json -version "$GITHUB_REF_NAME" apps/ios/CBBKit/Package.resolved
      - name: checksums
        run: |
          cp packaging/get.sh packaging/windows/get.ps1 dist/
          cd dist
          set -- *.tar.gz *.zip get.sh get.ps1 *.cdx.json
          for f in *.apk *.pkg; do [ -e "$f" ] && set -- "$@" "$f"; done
          sha256sum -- "$@" >SHA256SUMS
          cat SHA256SUMS
      - name: the winget manifest, from SHA256SUMS
        # For winget's repository, published with the release, which is
        # immutable once published; it goes to microsoft/winget-pkgs by a pull
        # request (docs/maintaining.md, "winget"). A pre-release stays out, as
        # it does from the tap.
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          out="$RUNNER_TEMP/winget"
          sh packaging/winget/manifest.sh "$GITHUB_REF_NAME" dist/SHA256SUMS "$out"
          (cd "$out" && zip -qX "$GITHUB_WORKSPACE/dist/winget-manifest.zip" ./*.yaml)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case $GITHUB_REF_NAME in *-*) prerelease=--prerelease ;; esac
          # shellcheck disable=SC2086 # $prerelease is one word or none
          # Our notes first (packaging/release-notes.sh), then GitHub's list
          # of the merged pull requests.
          sh packaging/release-notes.sh "$GITHUB_REF_NAME" >"$RUNNER_TEMP/notes.md"
          # A draft: the maintainer signs it and publishes it on their Mac with
          # release-sign publish (docs/maintaining.md, "Signed releases").
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "cbb $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes --verify-tag --draft $prerelease

  docker:
    # The image of packaging/docker, from the release's own Linux archives, so
    # it holds the binaries the release attests.
    if: github.ref_type == 'tag'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the image's digest in the release notes
      packages: write # push the image
      id-token: write # sign the attestation
      attestations: write
    env:
      IMAGE: ghcr.io/hunterewok/cbb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cbb-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from scratch
      - name: the image's bill of materials, from the programs in it (tools/sbom)
        run: |
          go run ./tools/sbom go -o "$RUNNER_TEMP/image.cdx.json" -name "$IMAGE" -version "$GITHUB_REF_NAME" \
            dist/cbb-linux-amd64.tar.gz dist/cbb-linux-arm64.tar.gz dist/cbb-linux-armv7.tar.gz
      - name: the build context
        run: |
          for a in amd64 arm64 armv7; do
            mkdir -p "$RUNNER_TEMP/$a"
            tar -xzf "dist/cbb-linux-$a.tar.gz" -C "$RUNNER_TEMP/$a"
          done
          t=$RUNNER_TEMP
          sh packaging/docker/context.sh "$t/image" amd64="$t/amd64/cbb/cbb" arm64="$t/arm64/cbb/cbb" \
            armv7="$t/armv7/cbb/cbb" notices="$t/amd64/cbb/THIRD_PARTY_NOTICES"
      - name: build and push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --name cbb >/dev/null
          version=${GITHUB_REF_NAME#v}
          set -- -t "$IMAGE:$version"
          case $GITHUB_REF_NAME in *-*) ;; *) set -- "$@" -t "$IMAGE:latest" ;; esac
          # The attestations below are GitHub's, the provenance and the bill of
          # materials; buildx's own would add a platform "unknown" to the
          # index, which confuses some NAS systems.
          docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
            "$@" --push --metadata-file "$RUNNER_TEMP/meta.json" "$RUNNER_TEMP/image"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")
          case $digest in sha256:*) ;; *) echo "no digest in the build's metadata" >&2; exit 1 ;; esac
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/image.cdx.json
          push-to-registry: true
      - name: the digest in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body >"$RUNNER_TEMP/notes.md"
          # shellcheck disable=SC2016 # the backticks are Markdown, not a command
          printf '\n## Docker\n\n```\n%s@%s\n```\n\nPin the image by this digest (packaging/docker/README.md).\n' "$IMAGE" "$DIGEST" >>"$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
