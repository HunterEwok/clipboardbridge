# Temporary: runs only TestAwayThroughRelay many times under load, with
# diagnostic logs, to find why it fails now and then. Not for merging.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  stress:
    name: relay stress (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, ubuntu-latest]
        shard: [1, 2, 3]
    env:
      CBB_TEST_CLIPBOARD: ""
      CBB_DEBUG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: stress
        shell: bash
        run: |
          go test -race -c -o "$RUNNER_TEMP/svc.test" ./internal/service
          # Load like CI's test job: the other packages' tests at the same time.
          (for i in 1 2; do CBB_DEBUG= go test -race -count=1 ./internal/... >/dev/null 2>&1; done) &
          load=$!
          fails=0
          mkdir -p "$RUNNER_TEMP/fail"
          cd internal/service
          for i in $(seq 1 25); do
            if ! "$RUNNER_TEMP/svc.test" -test.run 'TestAwayThroughRelay$' -test.count=1 -test.timeout=5m >"$RUNNER_TEMP/run.log" 2>&1; then
              fails=$((fails+1))
              cp "$RUNNER_TEMP/run.log" "$RUNNER_TEMP/fail/run-$i.log"
              echo "::group::failure $i"
              grep -v -E "UAPI|Routine:|padding|header protection" "$RUNNER_TEMP/run.log"
              echo "::endgroup::"
            fi
          done
          kill $load 2>/dev/null || true
          echo "failures: $fails of 25"
          test $fails -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: relay-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/fail
