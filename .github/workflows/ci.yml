# CI: checks, tests and cross builds for every pull request.
#
# The ruleset of main requires only the job "ci-ok", which passes when every other job passed,
# so jobs can be added or renamed without touching the ruleset.
# It does not run again on main: the ruleset merges only by squashing a pull request that is
# up to date with main, so main always holds the tree its pull request's run tested.
# Actions are pinned to commit SHAs; Dependabot updates them.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: govulncheck
        run: go tool govulncheck ./...
      - name: actionlint
        run: go tool actionlint
      - name: repository rules
        run: go run ./tools/repocheck
      - name: design tokens up to date and readable
        run: go run ./tools/tokens -check
      - name: app icon up to date
        run: go run ./tools/icon -check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # The runner's Windows session has a clipboard that the tests may overwrite.
      CBB_TEST_CLIPBOARD: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # nothing to download; leaves the shared cache key to the check job
      - name: go test
        run: go test -race ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('/v{0}', matrix.goarm) || '' }})
    strategy:
      fail-fast: false
      matrix:
        # go vet runs once per operating system: the code differs by system, not by
        # architecture, and the check job vets Linux.
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, cgo: "0" }
          - { goos: linux, goarch: arm64, runner: ubuntu-latest, cgo: "0" }
          - { goos: linux, goarch: arm, goarm: "7", runner: ubuntu-latest, cgo: "0" }
          - { goos: linux, goarch: arm, goarm: "6", runner: ubuntu-latest, cgo: "0" } # Raspberry Pi Zero W
          # The Mac's pasteboard agent needs cgo, so the macOS targets are built on macOS.
          - { goos: darwin, goarch: arm64, runner: macos-latest, cgo: "1", vet: true }
          - { goos: darwin, goarch: amd64, runner: macos-latest, cgo: "1" }
          - { goos: windows, goarch: amd64, runner: ubuntu-latest, cgo: "0", vet: true }
          - { goos: windows, goarch: arm64, runner: ubuntu-latest, cgo: "0" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # nothing to download; leaves the shared cache key to the check job
      - name: go vet
        if: matrix.vet
        run: go vet ./...
      - name: go build
        run: |
          if [ "$GOOS" = windows ]; then
            # cbbw.exe is the same program without a console window, for the agent.
            go build -trimpath -o "$RUNNER_TEMP/cbb.exe" ./cmd/cbb
            go build -trimpath -ldflags=-H=windowsgui -o "$RUNNER_TEMP/cbbw.exe" ./cmd/cbb
          else
            go build -trimpath -o "$RUNNER_TEMP/cbb" ./cmd/cbb
          fi
      - name: the release archive
        run: |
          name=$GOARCH
          if [ -n "$GOARM" ]; then name=armv$GOARM; fi
          if [ "$GOOS" = windows ]; then
            sh packaging/archive.sh "$RUNNER_TEMP/cbb.exe" "$GOOS" "$name" "$RUNNER_TEMP/dist"
            unzip -Z1 "$RUNNER_TEMP/dist/clipboardbridge-$GOOS-$name.zip" >"$RUNNER_TEMP/list"
            for f in cbb.exe cbbw.exe packaging/windows/install.ps1 packaging/windows/uninstall.ps1; do
              grep -qx "clipboardbridge/$f" "$RUNNER_TEMP/list"
            done
            file "$RUNNER_TEMP/cbb.exe" | grep -q '(console)'
            file "$RUNNER_TEMP/cbbw.exe" | grep -q '(GUI)'
          else
            sh packaging/archive.sh "$RUNNER_TEMP/cbb" "$GOOS" "$name" "$RUNNER_TEMP/dist"
            tar -tzf "$RUNNER_TEMP/dist/clipboardbridge-$GOOS-$name.tar.gz" | grep -qx "clipboardbridge/cbb"
          fi
      - name: keep the Windows archive for the installer test
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clipboardbridge-windows-amd64.zip
          path: ${{ runner.temp }}/dist/clipboardbridge-windows-amd64.zip
          if-no-files-found: error
          retention-days: 1
      - name: the agent has the pasteboard
        if: matrix.goos == 'darwin'
        # Without cgo the agent would start and fail; this build must link AppKit.
        run: otool -L "$RUNNER_TEMP/cbb" | grep -q AppKit.framework

  avahi:
    name: mdns with avahi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build the mDNS tests
        env:
          CGO_ENABLED: "0"
        run: go test -c -o "$RUNNER_TEMP/mdns.test" ./internal/mdns
      - name: run them beside avahi-daemon in a container
        run: |
          docker run --rm -v "$RUNNER_TEMP:/t:ro" debian:stable-slim sh -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq avahi-daemon avahi-utils dbus >/dev/null
            mkdir -p /run/dbus
            dbus-daemon --system --fork
            avahi-daemon --daemonize --no-chroot
            sleep 2
            CBB_TEST_AVAHI=1 /t/mdns.test -test.v -test.run "TestAvahi|TestSystemNetwork"
          '

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o "$RUNNER_TEMP/cbb" ./cmd/cbb
      - name: three members and a resolver in containers
        run: sh tools/e2e/e2e.sh "$RUNNER_TEMP/cbb"

  desktop:
    name: desktop clipboards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: install sway, Xvfb and the clipboard tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends sway wl-clipboard xvfb xclip >/dev/null
      - name: Wayland data-control under headless sway, and X11 under Xvfb
        run: |
          go test -c -o "$RUNNER_TEMP/desktop.test" ./internal/desktop
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway >"$RUNNER_TEMP/sway.log" 2>&1 &
          Xvfb :5 -screen 0 640x480x24 >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 100); do
            WAYLAND_DISPLAY=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name 'wayland-[0-9]' -printf '%f\n' | head -n 1)
            [ -n "$WAYLAND_DISPLAY" ] && [ -e /tmp/.X11-unix/X5 ] && break
            sleep 0.1
          done
          export WAYLAND_DISPLAY DISPLAY=:5
          CBB_TEST_WAYLAND=1 CBB_TEST_X11=1 "$RUNNER_TEMP/desktop.test" -test.v

  packaging:
    name: packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: shellcheck
        run: shellcheck packaging/archive.sh packaging/release-notes.sh packaging/get.sh packaging/linux/install.sh packaging/linux/firewall.sh packaging/linux/uninstall.sh packaging/macos/install.sh packaging/macos/uninstall.sh packaging/homebrew/formula.sh packaging/tmux/clipboardbridge-console.sh lite/packaging/notices.sh tools/e2e/e2e.sh mobile/cbbtun/bind.sh
      - name: systemd-analyze verify
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/cbb" ./cmd/cbb
          sudo install -m 0755 "$RUNNER_TEMP/cbb" /usr/local/bin/cbb
          sudo systemd-sysusers "$PWD/packaging/linux/clipboardbridge.sysusers"
          systemd-analyze verify packaging/linux/clipboardbridge.service
          systemd-analyze security --offline=true packaging/linux/clipboardbridge.service --threshold=30 # 3.0 on the scale it prints
      - name: release notes
        run: sh packaging/release-notes.sh v0.1.1 >/dev/null
      - name: the Homebrew formula takes its checksums from SHA256SUMS, and all four
        run: |
          sums="$RUNNER_TEMP/SHA256SUMS"
          for n in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            printf '%s  clipboardbridge-%s.tar.gz\n' "$(printf %s "$n" | sha256sum | cut -d' ' -f1)" "$n"
          done >"$sums"
          sh packaging/homebrew/formula.sh v1.2.3 "$sums" >"$RUNNER_TEMP/clipboardbridge.rb"
          ruby -c "$RUNNER_TEMP/clipboardbridge.rb"
          grep -qF "$(printf darwin-arm64 | sha256sum | cut -d' ' -f1)" "$RUNNER_TEMP/clipboardbridge.rb"
          grep -qF 'releases/download/v1.2.3/clipboardbridge-linux-arm64.tar.gz' "$RUNNER_TEMP/clipboardbridge.rb"
          sed -i /linux-arm64/d "$sums"
          if sh packaging/homebrew/formula.sh v1.2.3 "$sums" >/dev/null; then
            echo "formula.sh wrote a formula without a checksum" >&2
            exit 1
          fi
      - name: desktop entry
        run: |
          sudo apt-get install -y -qq desktop-file-utils >/dev/null
          desktop-file-validate packaging/linux/clipboardbridge-desktop.desktop
      - name: get.sh installs a release archive and refuses a changed one
        run: |
          # The archive as the release workflow makes it.
          rel="$RUNNER_TEMP/release"
          sh packaging/archive.sh "$RUNNER_TEMP/cbb" linux amd64 "$rel"
          (cd "$rel" && sha256sum -- *.tar.gz >SHA256SUMS)
          sudo CBB_RELEASE_DIR="$rel" sh packaging/get.sh --no-firewall
          systemctl is-active clipboardbridge.service
          for _ in $(seq 20); do sudo cbb status && break; sleep 0.5; done
          sudo cbb status | grep -q 'Not in a group'
          echo tampered >>"$rel/clipboardbridge-linux-amd64.tar.gz"
          if sudo CBB_RELEASE_DIR="$rel" sh packaging/get.sh --no-firewall; then
            echo "get.sh installed an archive that does not match SHA256SUMS" >&2
            exit 1
          fi
      - name: install.sh keeps a port, and uninstall.sh removes it all
        run: |
          sudo CBB_FIREWALL=no sh packaging/linux/install.sh --port 9000 "$RUNNER_TEMP/cbb" | grep -q 'TCP port 9000'
          grep -qx 'CBB_PORT=9000' /etc/clipboardbridge/clipboardbridge.env
          sudo CBB_FIREWALL=no sh packaging/linux/install.sh "$RUNNER_TEMP/cbb" | grep -q 'TCP port 9000'
          sudo CBB_FIREWALL=no sh packaging/linux/install.sh --port 8764 "$RUNNER_TEMP/cbb" | grep -q 'TCP port 8764'
          test ! -e /etc/clipboardbridge/clipboardbridge.env
          sudo sh /usr/local/share/clipboardbridge/uninstall.sh --purge
          for f in /usr/local/bin/cbb /etc/systemd/system/clipboardbridge.service /usr/local/share/clipboardbridge /etc/clipboardbridge /var/lib/clipboardbridge; do
            if [ -e "$f" ]; then
              echo "uninstall.sh left $f" >&2
              exit 1
            fi
          done
          if grep -q clipboardbridge /etc/tmux.conf; then
            echo "uninstall.sh left the tmux line" >&2
            exit 1
          fi

  homebrew:
    name: homebrew
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the formula installs a release archive
        run: |
          # The archive as the release workflow makes it; the formula wants the
          # other three too, so they are copies of it.
          rel="$RUNNER_TEMP/release"
          go build -trimpath -ldflags "-X github.com/HunterEwok/clipboardbridge/internal/version.Version=v0.0.1" -o "$RUNNER_TEMP/cbb" ./cmd/cbb
          sh packaging/archive.sh "$RUNNER_TEMP/cbb" darwin arm64 "$rel"
          for n in darwin-amd64 linux-amd64 linux-arm64; do
            cp "$rel/clipboardbridge-darwin-arm64.tar.gz" "$rel/clipboardbridge-$n.tar.gz"
          done
          (cd "$rel" && shasum -a 256 -- *.tar.gz >SHA256SUMS)
          brew tap-new --no-git local/test
          formula="$(brew --repository local/test)/Formula/clipboardbridge.rb"
          sh packaging/homebrew/formula.sh v0.0.1 "$rel/SHA256SUMS" "file://$rel" >"$formula"
          cat "$formula"
          brew audit --strict local/test/clipboardbridge
          brew install local/test/clipboardbridge
          brew test local/test/clipboardbridge
          "$(brew --prefix)/bin/cbb" version | grep -q v0.0.1
      - name: install.sh --in-place runs a root-owned copy of Homebrew's binary, and uninstall.sh removes it all
        run: |
          opt="$(brew --prefix)/opt/clipboardbridge"
          share="$opt/share/clipboardbridge/packaging/macos"
          daemon=io.github.hunterewok.clipboardbridge
          sudo sh "$share/install.sh" --in-place "$opt/bin/cbb"
          # The service, which holds the group's keys, runs a root-owned copy, never the
          # binary Homebrew's user may replace; the agent runs Homebrew's.
          service="/Library/Application Support/clipboardbridge/bin/cbb"
          grep -qF "<string>$service</string>" "/Library/LaunchDaemons/$daemon.plist"
          if grep -qF "<string>$opt/bin/cbb</string>" "/Library/LaunchDaemons/$daemon.plist"; then
            echo "the service runs Homebrew's binary" >&2
            exit 1
          fi
          [ "$(sudo stat -f %Su "$service")" = root ]
          [ "$(sudo stat -f %Su "$(dirname "$service")")" = root ]
          grep -qF "<string>$opt/bin/cbb</string>" "/Library/LaunchAgents/$daemon.agent.plist"
          plutil -lint "/Library/LaunchDaemons/$daemon.plist" "/Library/LaunchAgents/$daemon.agent.plist"
          for _ in $(seq 20); do sudo "$opt/bin/cbb" status && break; sleep 0.5; done
          sudo "$opt/bin/cbb" status | grep -q 'Not in a group'
          fw=/usr/libexec/ApplicationFirewall/socketfilterfw
          sudo "$fw" --listapps | grep -qF "$service"
          # Again, as after an upgrade: it restarts the service.
          sudo sh "$share/install.sh" --in-place "$opt/bin/cbb"
          for _ in $(seq 20); do sudo "$opt/bin/cbb" status && break; sleep 0.5; done
          sudo sh "$share/uninstall.sh" --purge
          for f in "/Library/LaunchDaemons/$daemon.plist" "/Library/LaunchAgents/$daemon.agent.plist" \
            "/Library/Application Support/clipboardbridge" /Library/Logs/clipboardbridge; do
            if [ -e "$f" ]; then
              echo "uninstall.sh left $f" >&2
              exit 1
            fi
          done
          if sudo launchctl print "system/$daemon" >/dev/null 2>&1; then
            echo "uninstall.sh left the service running" >&2
            exit 1
          fi
          if sudo "$fw" --listapps | grep -qF "$service"; then
            echo "uninstall.sh left the firewall entry" >&2
            exit 1
          fi
          brew uninstall clipboardbridge
      - name: get.sh installs a release archive on a Mac and refuses a changed one
        run: |
          rel="$RUNNER_TEMP/release"
          daemon=io.github.hunterewok.clipboardbridge
          (cd "$rel" && shasum -a 256 -- *.tar.gz >SHA256SUMS)
          sudo CBB_RELEASE_DIR="$rel" sh packaging/get.sh --no-firewall
          for _ in $(seq 20); do sudo /usr/local/bin/cbb status && break; sleep 0.5; done
          sudo /usr/local/bin/cbb status | grep -q 'Not in a group'
          if sudo CBB_RELEASE_DIR="$rel" sh packaging/get.sh --port 9000; then
            echo "get.sh took --port on a Mac" >&2
            exit 1
          fi
          echo tampered >>"$rel/clipboardbridge-darwin-arm64.tar.gz"
          if sudo CBB_RELEASE_DIR="$rel" sh packaging/get.sh --no-firewall; then
            echo "get.sh installed an archive that does not match SHA256SUMS" >&2
            exit 1
          fi
          sudo sh /usr/local/share/clipboardbridge/uninstall.sh --purge
          for f in /usr/local/bin/cbb /usr/local/share/clipboardbridge "/Library/LaunchDaemons/$daemon.plist"; do
            if [ -e "$f" ]; then
              echo "uninstall.sh left $f" >&2
              exit 1
            fi
          done

  windows:
    name: windows installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clipboardbridge-windows-amd64.zip
          path: ${{ runner.temp }}/release
      - name: PSScriptAnalyzer
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          # Write-Host is what an installer talks with.
          $found = Invoke-ScriptAnalyzer -Path packaging/windows -Recurse -ExcludeRule PSAvoidUsingWriteHost
          $found | Format-Table -AutoSize -Wrap
          if ($found) { exit 1 }
      - name: get.ps1 installs a release archive and refuses a changed one
        env:
          CBB_RELEASE_DIR: ${{ runner.temp }}/release
          CBB_ERROR_DETAILS: "1"
        run: |
          $rel = $env:CBB_RELEASE_DIR
          $zip = Join-Path $rel 'clipboardbridge-windows-amd64.zip'
          "$((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower())  clipboardbridge-windows-amd64.zip" | Set-Content (Join-Path $rel 'SHA256SUMS')
          Get-Content packaging/windows/get.ps1 -Raw | Invoke-Expression
          if ((Get-Service clipboardbridge).Status -ne 'Running') { throw 'the service does not run' }
          $cbb = "$env:ProgramFiles\clipboardbridge\cbb.exe"
          $status = & $cbb status | Out-String
          if ($status -notmatch 'Not in a group') { throw "cbb status: $status" }
          $before = (Get-Item $cbb).LastWriteTimeUtc
          Add-Content $zip 'tampered'
          Get-Content packaging/windows/get.ps1 -Raw | Invoke-Expression
          if ((Get-Item $cbb).LastWriteTimeUtc -ne $before) { throw 'get.ps1 installed an archive that does not match SHA256SUMS' }
      - name: install.ps1 keeps a port and the firewall rules follow it, and uninstall.ps1 removes it all
        env:
          CBB_ERROR_DETAILS: "1"
        run: |
          Expand-Archive "$env:RUNNER_TEMP\release\clipboardbridge-windows-amd64.zip" "$env:RUNNER_TEMP\unpacked"
          $install = "$env:RUNNER_TEMP\unpacked\clipboardbridge\packaging\windows\install.ps1"
          function ports { @(Get-NetFirewallRule -Group clipboardbridge -ErrorAction SilentlyContinue | Get-NetFirewallPortFilter | ForEach-Object { "$($_.Protocol) $($_.LocalPort)" }) | Sort-Object }
          function check($want) {
            $got = (ports) -join ', '
            if ($got -ne $want) { throw "firewall rules: $got, want $want" }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File $install -Port 9000
          if ($LASTEXITCODE -ne 0) { exit 1 }
          check 'TCP 9000, UDP 5353'
          powershell -NoProfile -ExecutionPolicy Bypass -File $install
          if ($LASTEXITCODE -ne 0) { exit 1 }
          check 'TCP 9000, UDP 5353'
          $svcEnv = (Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\clipboardbridge).Environment
          if ($svcEnv -ne 'CBB_PORT=9000') { throw "the service environment: $svcEnv" }
          powershell -NoProfile -ExecutionPolicy Bypass -File $install -Port 8764 -NoFirewall
          if ($LASTEXITCODE -ne 0) { exit 1 }
          check ''
          powershell -NoProfile -ExecutionPolicy Bypass -File $install
          if ($LASTEXITCODE -ne 0) { exit 1 }
          check 'TCP 8764, UDP 5353'
          # Only the service, the system and administrators reach the keys.
          $acl = (Get-Acl "$env:ProgramData\clipboardbridge\state").Access | ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique
          $want = @('BUILTIN\Administrators', 'NT AUTHORITY\SYSTEM', 'NT SERVICE\clipboardbridge')
          if (Compare-Object $acl $want) { throw "the state folder's access list: $($acl -join ', ')" }
          & "$env:ProgramFiles\clipboardbridge\cbb.exe" status
          if ($LASTEXITCODE -ne 0) { throw 'cbb status failed after the reinstalls' }
          Get-Content "$env:ProgramData\clipboardbridge\logs\service.log"

          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:ProgramFiles\clipboardbridge\uninstall.ps1" -Purge
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Get-Service clipboardbridge -ErrorAction SilentlyContinue) { throw 'uninstall.ps1 left the service' }
          if (ports) { throw 'uninstall.ps1 left firewall rules' }
          foreach ($p in @("$env:ProgramFiles\clipboardbridge", "$env:ProgramData\clipboardbridge",
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\clipboardbridge')) {
            if (Test-Path $p) { throw "uninstall.ps1 left $p" }
          }
          if (Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run -Name clipboardbridge -ErrorAction SilentlyContinue) { throw 'uninstall.ps1 left the sign-in entry' }
          if ([Environment]::GetEnvironmentVariable('Path', 'Machine') -match 'clipboardbridge') { throw 'uninstall.ps1 left the PATH entry' }
          net.exe localgroup clipboardbridge 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'uninstall.ps1 -Purge left the group' }
          $global:LASTEXITCODE = 0

  kit:
    name: phone kit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: swift test (in the Swift container on Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir interop-out
          docker run --rm -v "$PWD:/src" -w /src/apps/ios/ClipboardBridgeKit -e CBB_INTEROP_OUT=/src/interop-out swift:6.2-noble sh -euc '
            swift test
            swift build -c release --product clipboardbridge-interop --static-swift-stdlib
            cp "$(swift build -c release --show-bin-path)/clipboardbridge-interop" /src/clipboardbridge-interop'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.os == 'Linux'
        with:
          go-version-file: go.mod
          cache: false
      - name: the Swift phone admits the Go joiner, and Go reads its member frames
        if: runner.os == 'Linux'
        run: |
          CBB_SWIFT_INTEROP="$PWD/clipboardbridge-interop" go test ./internal/pair -run TestSwiftMemberAdmitsGoJoiner -v
          # swift test just wrote testdata/interop/swift-member.json, and to
          # interop-out the records it signed, a certificate it renewed and
          # what an admin phone makes.
          go test ./internal/node -run TestSwiftMemberFrames -v
          CBB_INTEROP_OUT="$PWD/interop-out" go test ./internal/group -run 'TestSwiftRecords|TestSwiftRenewal|TestSwiftAdmin|TestSwiftRoot|TestSwiftComputerAdmin' -v
      - name: swift test
        if: runner.os == 'macOS'
        working-directory: apps/ios/ClipboardBridgeKit
        run: |
          swift test
          swift build --product clipboardbridge-interop
          cp "$(swift build --show-bin-path)/clipboardbridge-interop" "$GITHUB_WORKSPACE/clipboardbridge-interop"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.os == 'macOS'
        with:
          go-version-file: go.mod
          cache: false
      - name: the Swift phone admits the Go joiner and syncs with a Go member over TLS
        if: runner.os == 'macOS'
        run: |
          # A throwaway keychain for the tool's identity, unlocked and the default.
          security create-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
          CBB_SWIFT_INTEROP_TLS="$PWD/clipboardbridge-interop" go test -timeout 3m ./internal/pair -run TestSwiftMemberAdmitsGoJoinerTLS -v
          CBB_SWIFT_INTEROP_TLS="$PWD/clipboardbridge-interop" go test -timeout 3m ./internal/node -run TestSwiftMemberTLS -v

  app:
    name: iPhone app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: bind the phones' tunnel, which the app links
        run: mobile/cbbtun/bind.sh ios apps/ios/Cbbtun.xcframework
      - name: generate the Xcode project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: build and test on the simulator, signed ad hoc
        working-directory: apps/ios
        run: |
          set -o pipefail
          # The first available iPhone simulator.
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          # Ad hoc signing needs no Apple account, and without a signature the
          # simulator gives the app no keychain (-34018), which its TLS tests use.
          xcodebuild test -project ClipboardBridge.xcodeproj -scheme ClipboardBridge -destination "id=$udid" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tail -n 200

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the protocol core's tests
        working-directory: apps/android
        # The kit writes what it signs for the Go tests, as the Swift kit does.
        run: CBB_INTEROP_OUT="$GITHUB_WORKSPACE/interop-out" ./gradlew --no-daemon -p kit test
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Go reads what the Kotlin kit signed
        run: CBB_INTEROP_OUT="$PWD/interop-out" go test ./internal/group -run 'TestSwiftRecords|TestSwiftRenewal|TestSwiftAdmin|TestSwiftRoot|TestSwiftComputerAdmin' -v
      - name: Go pairs and syncs with the Kotlin kit over TLS
        # The Kotlin twin of clipboardbridge-interop plays the phone; Conscrypt
        # gives it TLS 1.3 on Linux as on Android.
        run: |
          (cd apps/android && ./gradlew --no-daemon -p kit interopScript)
          tool="$PWD/apps/android/kit/build/interop/clipboardbridge-interop"
          CBB_SWIFT_INTEROP="$tool" go test ./internal/pair -run 'TestSwiftMemberAdmitsGoJoiner$' -v
          CBB_SWIFT_INTEROP_TLS="$tool" go test -timeout 3m ./internal/pair -run TestSwiftMemberAdmitsGoJoinerTLS -v
          CBB_SWIFT_INTEROP_TLS="$tool" go test -timeout 3m ./internal/node -run TestSwiftMemberTLS -v
      - name: build the app and run its unit tests
        working-directory: apps/android
        # The runner image has the Android SDK; Gradle fetches a missing platform.
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug

  lite:
    name: lite member (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the Rust toolchain, and a cross compiler for the Raspberry Pi
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target aarch64-unknown-linux-gnu,arm-unknown-linux-musleabihf
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p clipboardbridge-embassy --features host --all-targets -- -D warnings
      - name: cargo test (the interop vectors in testdata/interop too)
        run: cargo test --locked --workspace
      - name: cargo build
        run: |
          cargo build --locked --release
          cargo build --locked --release -p clipboardbridge-embassy --features host
      - name: cargo build for the Raspberry Pi
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target aarch64-unknown-linux-gnu
      - name: cargo build for the Raspberry Pi Zero (ARMv6, static; see lite/.cargo/config.toml)
        run: cargo build --locked --release --target arm-unknown-linux-musleabihf
      - name: the crates' licenses, as the release archives carry them
        run: sh packaging/notices.sh arm-unknown-linux-musleabihf | grep -q '^rustls '
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the lite member joins by the phone and syncs with Go members
        working-directory: .
        run: CBB_LITE="$PWD/lite/target/release/cbb-lite" go test -race ./internal/service -run TestLiteMember -v
      - name: the ESP32's network code joins by the phone on Linux, over a TAP interface
        working-directory: .
        run: |
          sudo ip tuntap add name tap0 mode tap user "$USER"
          sudo ip addr add 192.168.69.1/24 dev tap0
          sudo ip link set tap0 up
          CBB_ESP32_ON_LINUX="$PWD/lite/target/release/esp32-on-linux" go test -race ./internal/service -run TestEmbassyJoiner -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbb-lite-linux-arm64
          path: lite/target/aarch64-unknown-linux-gnu/release/cbb-lite
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbb-lite-linux-armv6
          path: lite/target/arm-unknown-linux-musleabihf/release/cbb-lite
          retention-days: 14

  esp32:
    name: lite core on the ESP32
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lite
    env:
      # The Rust toolchain for Xtensa (the ESP32-S3) from esp-rs/rust-build,
      # what espup installs, fetched directly and checked against these hashes.
      ESP_RUST: 1.99.0.0
      ESP_RUST_SHA256: b11376cf28b43ad31bd264de6987f6f50b8008824dcb12e6a7212331da5a8ed7
      ESP_RUST_SRC_SHA256: 31cee3ac662c026437c895846cb093b5d8438c13aa6c5f8d561e22bf7f8be543
      # Espressif's QEMU (the ESP32-S3 machine) and espflash, which writes the
      # flash image, for the firmware's self-test.
      ESP_QEMU: esp-develop-9.2.2-20260417
      ESP_QEMU_SHA256: 0eecb2a34a5586c0e59110f77b9343b7b336e82fdb0e1a30e1dc1bab8a547e35
      ESPFLASH: 4.6.0
      ESPFLASH_SHA256: c4fcfa32ddc3155608f003a230e6f3c184eff9641ec9cfa8eb54f1b515d403e7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the Rust toolchain for RISC-V
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target riscv32imac-unknown-none-elf
          rustup default stable
      - name: the core with TLS without an operating system, RISC-V (the ESP32-C6)
        run: |
          cargo clippy --locked -p clipboardbridge-core --features tls --target riscv32imac-unknown-none-elf -- -D warnings
          cargo build --locked -p clipboardbridge-core --release --target riscv32imac-unknown-none-elf
          cargo build --locked -p clipboardbridge-core --features tls --release --target riscv32imac-unknown-none-elf
      - name: the Rust toolchain for Xtensa
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/esp-rs/rust-build/releases/download/v$ESP_RUST"
          curl -fsSL --retry 3 -o rust.tar.xz "$base/rust-$ESP_RUST-x86_64-unknown-linux-gnu.tar.xz"
          curl -fsSL --retry 3 -o rust-src.tar.xz "$base/rust-src-$ESP_RUST.tar.xz"
          echo "$ESP_RUST_SHA256  rust.tar.xz" | sha256sum -c -
          echo "$ESP_RUST_SRC_SHA256  rust-src.tar.xz" | sha256sum -c -
          tar xf rust.tar.xz
          tar xf rust-src.tar.xz
          ./rust-nightly-x86_64-unknown-linux-gnu/install.sh --destdir="$RUNNER_TEMP/esp" --prefix= --without=rust-docs-json-preview,rust-docs --disable-ldconfig
          ./rust-src-nightly/install.sh --destdir="$RUNNER_TEMP/esp" --prefix= --disable-ldconfig
          rustup toolchain link esp "$RUNNER_TEMP/esp"
      - name: the core with TLS without an operating system, Xtensa (the ESP32-S3)
        run: cargo +esp build --locked -Zbuild-std=core,alloc -p clipboardbridge-core --features tls --release --target xtensa-esp32s3-none-elf
      - name: the firmware for the Arduino Nano ESP32
        working-directory: lite/esp32
        run: |
          cargo +esp fmt --check
          cargo +esp clippy --locked --release -- -D warnings
          cargo +esp clippy --locked --release --no-default-features --features qemu -- -D warnings
          cargo +esp build --locked --release
      - name: Espressif's QEMU and espflash
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libslirp0 libsdl2-2.0-0 libpixman-1-0
          curl -fsSL --retry 3 -o qemu.tar.xz "https://github.com/espressif/qemu/releases/download/$ESP_QEMU/qemu-xtensa-softmmu-${ESP_QEMU//-/_}-x86_64-linux-gnu.tar.xz"
          echo "$ESP_QEMU_SHA256  qemu.tar.xz" | sha256sum -c -
          tar xf qemu.tar.xz
          curl -fsSL --retry 3 -o espflash.zip "https://github.com/esp-rs/espflash/releases/download/v$ESPFLASH/espflash-x86_64-unknown-linux-gnu.zip"
          echo "$ESPFLASH_SHA256  espflash.zip" | sha256sum -c -
          unzip -q espflash.zip
      - name: the firmware in QEMU (the console, settings kept across restarts, the TLS 1.3 self-test)
        working-directory: lite/esp32
        run: QEMU="$RUNNER_TEMP/qemu/bin/qemu-system-xtensa" ESPFLASH="$RUNNER_TEMP/espflash" ./qemu-test.sh

  zxnext:
    name: ZX Spectrum Next
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # z88dk from its release source, checked against this hash; the build
      # (about 8 minutes, the ZX Next libraries only) is cached.
      Z88DK: "2.3"
      Z88DK_SHA256: e08887ef9344f8dbd9d669bb904e17c35290a316bb1fe8b02c1a45b0d291292f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the frame parser's tests on the host
        working-directory: apps/zxnext
        run: make test
      - name: z88dk from the cache
        id: z88dk
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/z88dk
          key: z88dk-${{ env.Z88DK }}-zxn-${{ runner.os }}
      - name: z88dk from its source
        if: steps.z88dk.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flex libxml2-dev libgmp-dev libboost-dev texinfo dos2unix
          curl -fsSL --retry 3 -o z88dk.tgz "https://github.com/z88dk/z88dk/releases/download/v$Z88DK/z88dk-src-$Z88DK.tgz"
          echo "$Z88DK_SHA256  z88dk.tgz" | sha256sum -c -
          tar xzf z88dk.tgz
          cd z88dk && ./build.sh -k -p zxn
          # Keep only what zcc needs: the libraries, headers, crt sources and m4 macros.
          find libsrc -name '*.o' -delete
          find src -mindepth 1 -maxdepth 1 ! -name m4 -exec rm -rf {} +
          rm -rf testsuite examples doc
      - name: the dot command
        working-directory: apps/zxnext
        run: |
          export PATH="$RUNNER_TEMP/z88dk/bin:$PATH" ZCCCFG="$RUNNER_TEMP/z88dk/lib/config"
          make
          test -s build/CBB

  phonetunnel:
    name: phone tunnel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            out: cbbtun.aar
          - target: ios
            os: macos-latest
            out: Cbbtun.xcframework
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: bind the tunnel with gomobile
        # gomobile and gobind come from go.mod's tools; the runner images have
        # the Android NDK and Xcode. The Android app's build binds it too.
        env:
          TARGET: ${{ matrix.target }}
          OUT: ${{ matrix.out }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-}"
          mobile/cbbtun/bind.sh "$TARGET" "$OUT"
          ls -la "$OUT"

  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, test, build, avahi, e2e, desktop, packaging, homebrew, windows, kit, app, android, phonetunnel, lite, esp32, zxnext]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "A required job did not pass."
            exit 1
          fi
