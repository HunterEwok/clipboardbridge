# CI: checks, tests and cross builds for every pull request and for main.
#
# The ruleset of main requires only the job "ci-ok", which passes when every other job passed,
# so jobs can be added or renamed without touching the ruleset.
# Actions are pinned to commit SHAs; Dependabot updates them.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: govulncheck
        run: go tool govulncheck ./...
      - name: actionlint
        run: go tool actionlint
      - name: repository rules
        run: go run ./tools/repocheck
      - name: design tokens up to date and readable
        run: go run ./tools/tokens -check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # nothing to download; leaves the shared cache key to the check job
      - name: go test
        run: go test -race ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('/v{0}', matrix.goarm) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, cgo: "0" }
          - { goos: linux, goarch: arm64, runner: ubuntu-latest, cgo: "0" }
          - { goos: linux, goarch: arm, goarm: "7", runner: ubuntu-latest, cgo: "0" }
          - { goos: linux, goarch: arm, goarm: "6", runner: ubuntu-latest, cgo: "0" } # Raspberry Pi Zero W
          # The Mac's pasteboard agent needs cgo, so the macOS targets are built on macOS.
          - { goos: darwin, goarch: arm64, runner: macos-latest, cgo: "1" }
          - { goos: darwin, goarch: amd64, runner: macos-latest, cgo: "1" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # nothing to download; leaves the shared cache key to the check job
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build -trimpath -o "$RUNNER_TEMP/clipbridge" ./cmd/clipbridge
      - name: the release archive
        run: |
          name=$GOARCH
          if [ -n "$GOARM" ]; then name=armv$GOARM; fi
          sh packaging/archive.sh "$RUNNER_TEMP/clipbridge" "$GOOS" "$name" "$RUNNER_TEMP/dist"
          tar -tzf "$RUNNER_TEMP/dist/clipbridge-$GOOS-$name.tar.gz" | grep -qx "clipbridge/clipbridge"
      - name: the agent has the pasteboard
        if: matrix.goos == 'darwin'
        # Without cgo the agent would start and fail; this build must link AppKit.
        run: otool -L "$RUNNER_TEMP/clipbridge" | grep -q AppKit.framework

  avahi:
    name: mdns with avahi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build the mDNS tests
        env:
          CGO_ENABLED: "0"
        run: go test -c -o "$RUNNER_TEMP/mdns.test" ./internal/mdns
      - name: run them beside avahi-daemon in a container
        run: |
          docker run --rm -v "$RUNNER_TEMP:/t:ro" debian:stable-slim sh -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq avahi-daemon avahi-utils dbus >/dev/null
            mkdir -p /run/dbus
            dbus-daemon --system --fork
            avahi-daemon --daemonize --no-chroot
            sleep 2
            CLIPBRIDGE_TEST_AVAHI=1 /t/mdns.test -test.v -test.run "TestAvahi|TestSystemNetwork"
          '

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o "$RUNNER_TEMP/clipbridge" ./cmd/clipbridge
      - name: three members and a resolver in containers
        run: sh tools/e2e/e2e.sh "$RUNNER_TEMP/clipbridge"

  desktop:
    name: desktop clipboards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: install sway, Xvfb and the clipboard tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends sway wl-clipboard xvfb xclip >/dev/null
      - name: Wayland data-control under headless sway, and X11 under Xvfb
        run: |
          go test -c -o "$RUNNER_TEMP/desktop.test" ./internal/desktop
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway >"$RUNNER_TEMP/sway.log" 2>&1 &
          Xvfb :5 -screen 0 640x480x24 >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 100); do
            WAYLAND_DISPLAY=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name 'wayland-[0-9]' -printf '%f\n' | head -n 1)
            [ -n "$WAYLAND_DISPLAY" ] && [ -e /tmp/.X11-unix/X5 ] && break
            sleep 0.1
          done
          export WAYLAND_DISPLAY DISPLAY=:5
          CLIPBRIDGE_TEST_WAYLAND=1 CLIPBRIDGE_TEST_X11=1 "$RUNNER_TEMP/desktop.test" -test.v

  packaging:
    name: packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: shellcheck
        run: shellcheck packaging/archive.sh packaging/release-notes.sh packaging/linux/get.sh packaging/linux/install.sh packaging/macos/install.sh packaging/tmux/clipbridge-console.sh tools/e2e/e2e.sh
      - name: systemd-analyze verify
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/clipbridge" ./cmd/clipbridge
          sudo install -m 0755 "$RUNNER_TEMP/clipbridge" /usr/local/bin/clipbridge
          sudo systemd-sysusers "$PWD/packaging/linux/clipbridge.sysusers"
          systemd-analyze verify packaging/linux/clipbridge.service
          systemd-analyze security --offline=true packaging/linux/clipbridge.service --threshold=30 # 3.0 on the scale it prints
      - name: release notes
        run: sh packaging/release-notes.sh v0.1.1 >/dev/null
      - name: desktop entry
        run: |
          sudo apt-get install -y -qq desktop-file-utils >/dev/null
          desktop-file-validate packaging/linux/clipbridge-desktop.desktop
      - name: get.sh installs a release archive and refuses a changed one
        run: |
          # The archive as the release workflow makes it.
          rel="$RUNNER_TEMP/release"
          sh packaging/archive.sh "$RUNNER_TEMP/clipbridge" linux amd64 "$rel"
          (cd "$rel" && sha256sum -- *.tar.gz >SHA256SUMS)
          sudo CLIPBRIDGE_RELEASE_DIR="$rel" sh packaging/linux/get.sh --no-firewall
          systemctl is-active clipbridge.service
          for _ in $(seq 20); do sudo clipbridge status && break; sleep 0.5; done
          sudo clipbridge status | grep -q 'Not in a group'
          echo tampered >>"$rel/clipbridge-linux-amd64.tar.gz"
          if sudo CLIPBRIDGE_RELEASE_DIR="$rel" sh packaging/linux/get.sh --no-firewall; then
            echo "get.sh installed an archive that does not match SHA256SUMS" >&2
            exit 1
          fi

  kit:
    name: phone kit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: swift test (in the Swift container on Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir interop-out
          docker run --rm -v "$PWD:/src" -w /src/apps/ios/ClipbridgeKit -e CLIPBRIDGE_INTEROP_OUT=/src/interop-out swift:6.2-noble sh -euc '
            swift test
            swift build -c release --product clipbridge-interop --static-swift-stdlib
            cp "$(swift build -c release --show-bin-path)/clipbridge-interop" /src/clipbridge-interop'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.os == 'Linux'
        with:
          go-version-file: go.mod
          cache: false
      - name: the Swift phone admits the Go joiner, and Go reads its member frames
        if: runner.os == 'Linux'
        run: |
          CLIPBRIDGE_SWIFT_INTEROP="$PWD/clipbridge-interop" go test ./internal/pair -run TestSwiftMemberAdmitsGoJoiner -v
          # swift test just wrote testdata/interop/swift-member.json, and to
          # interop-out the records it signed and a certificate it renewed.
          go test ./internal/node -run TestSwiftMemberFrames -v
          CLIPBRIDGE_INTEROP_OUT="$PWD/interop-out" go test ./internal/group -run 'TestSwiftRecords|TestSwiftRenewal' -v
      - name: swift test
        if: runner.os == 'macOS'
        working-directory: apps/ios/ClipbridgeKit
        run: |
          swift test
          swift build --product clipbridge-interop
          cp "$(swift build --show-bin-path)/clipbridge-interop" "$GITHUB_WORKSPACE/clipbridge-interop"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.os == 'macOS'
        with:
          go-version-file: go.mod
          cache: false
      - name: the Swift phone admits the Go joiner and syncs with a Go member over TLS
        if: runner.os == 'macOS'
        run: |
          # A throwaway keychain for the tool's identity, unlocked and the default.
          security create-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
          CLIPBRIDGE_SWIFT_INTEROP_TLS="$PWD/clipbridge-interop" go test -timeout 3m ./internal/pair -run TestSwiftMemberAdmitsGoJoinerTLS -v
          CLIPBRIDGE_SWIFT_INTEROP_TLS="$PWD/clipbridge-interop" go test -timeout 3m ./internal/node -run TestSwiftMemberTLS -v

  app:
    name: iPhone app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: generate the Xcode project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: build and test on the simulator, without signing
        working-directory: apps/ios
        run: |
          set -o pipefail
          # The first available iPhone simulator.
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test -project Clipbridge.xcodeproj -scheme Clipbridge -destination "id=$udid" \
            CODE_SIGNING_ALLOWED=NO | tail -n 200

  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, test, build, avahi, e2e, desktop, packaging, kit, app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "A required job did not pass."
            exit 1
          fi
