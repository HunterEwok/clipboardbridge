# SPDX-License-Identifier: AGPL-3.0-only
# cargo-deny: what the lite member's crates may be. CI's advisories job checks both
# workspaces with it, this one and lite/esp32 (with --config ../deny.toml):
#   cargo deny --locked check licenses bans sources
# Known vulnerabilities are left to OSV-Scanner in the same job.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
# Every license here lets the crate be built into a program under the AGPL-3.0;
# a crate under any other license fails the check until it is looked at.
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# One list for both workspaces, so a license only one of them uses is fine.
unused-allowed-license = "allow"

[bans]
# Two versions of one crate cost size, not safety (the crypto crates move between
# majors slowly), so they are not reported.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The ESP32 firmware's esp-hal is pinned to a git commit (lite/esp32/Cargo.toml).
allow-git = [
    "https://github.com/esp-rs/esp-hal",
    "https://github.com/esp-rs/esp-pacs.git",
    "https://github.com/esp-rs/esp-wifi-sys.git",
]
