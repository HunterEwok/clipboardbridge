[package]
name = "clipboardbridge-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
description = "The lite member of clipboardbridge, for small Linux devices"
publish = false

[workspace]
members = ["core", "embassy", "ffi", "ring-shim"]
exclude = ["esp32", "core/fuzz"]

[[bin]]
name = "cbb"
path = "src/main.rs"

[features]
default = ["tunnel"]
# Sync away from home. GotaTun needs 64-bit atomics, which 32-bit MIPS lacks,
# so the MIPS builds leave it out (docs/roadmap.md, item 37).
tunnel = ["dep:gotatun", "dep:bytes", "dep:smoltcp"]

[dependencies]
clipboardbridge-core = { path = "core", features = ["std", "tls"] }
if-addrs = "0.15.0"
libc = "0.2.191"
mdns-sd = "0.21.6"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WireGuard for sync away from home: GotaTun's noise protocol, sans I/O, with
# the ring stand-in below; smoltcp is the TCP inside the tunnel.
gotatun = { version = "0.10.2", default-features = false, features = ["ring"], optional = true }
bytes = { version = "1", optional = true }
getrandom = { version = "0.4", features = ["std"] }
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp"], optional = true }

[dev-dependencies]
# Signs the releases the update tests check.
p256 = { version = "0.14", default-features = false, features = ["alloc", "arithmetic", "ecdsa", "pkcs8"] }

# GotaTun's AEAD on RustCrypto instead of ring's C and assembly (ring-shim/src/lib.rs).
[patch.crates-io]
ring = { path = "ring-shim" }

[profile.release]
# Small devices: a small binary matters more than the last bit of speed.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The tests check signatures by the thousand (the record sets at the limits
# in testdata/interop/v2-records.json); unoptimized elliptic curves make
# that minutes instead of seconds. Only the dependencies: the crates of this
# workspace still build as the tests want them, with overflow checks.
[profile.dev.package."*"]
opt-level = 2
