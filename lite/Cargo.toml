[package]
name = "clipboardbridge-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "The lite member of clipboardbridge, for small Linux devices"
publish = false

[workspace]
members = ["core", "embassy"]
exclude = ["esp32"]

[[bin]]
name = "cbb"
path = "src/main.rs"

[dependencies]
clipboardbridge-core = { path = "core", features = ["std", "tls"] }
if-addrs = "0.15.0"
libc = "0.2.191"
mdns-sd = "0.21.6"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Small devices: a small binary matters more than the last bit of speed.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
