# Stands in for ring under GotaTun (see src/lib.rs): lite/Cargo.toml patches
# ring with it.
[package]
name = "ring"
version = "0.17.14"
edition = "2024"
license = "AGPL-3.0-only"
description = "The part of ring's AEAD API that GotaTun uses, on RustCrypto's ChaCha20-Poly1305"
publish = false

[dependencies]
chacha20poly1305 = { version = "0.10.1", default-features = false }

# ring's features, so that crates that may ask for them resolve (rustls-webpki
# lists ring as an optional dependency, off here); none changes anything.
[features]
default = ["alloc", "dev_urandom_fallback"]
alloc = []
std = ["alloc"]
dev_urandom_fallback = []
