[package]
name = "clipboardbridge-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
description = "The Rust core's one entry point as WebAssembly, which Go runs under wazero on Windows, macOS and FreeBSD"
publish = false

[lib]
name = "cbb_wasm"
# A wasm module for wasm32-unknown-unknown; on any other target the crate
# is empty, so the workspace's host builds and lints pass over it.
crate-type = ["cdylib", "lib"]

[dependencies]
clipboardbridge-core = { path = "../core", features = ["std"] }
getrandom = { version = "0.4", default-features = false }
