[package]
name = "clipboardbridge-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
description = "The Rust core's entry point as C functions, for Go and the phone apps"
publish = false

[lib]
name = "cbb_ffi"
# staticlib for the iPhone and the Swift kit's tests, cdylib for Android and
# the Kotlin kit's tests (through JNA), lib for the Rust tests.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
clipboardbridge-core = { path = "../core", features = ["std"] }

[dev-dependencies]
serde_json = "1"
