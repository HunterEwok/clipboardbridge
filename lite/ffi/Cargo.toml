[package]
name = "clipboardbridge-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
description = "The Rust core's group rules for the phone apps, through UniFFI bindings for Swift and Kotlin"
publish = false

[lib]
name = "cbb_ffi"
# staticlib for the iPhone's xcframework, cdylib for Android and the JVM
# tests, lib for the Rust tests.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
# Writes the Swift and Kotlin bindings from the built library:
# cargo run -p clipboardbridge-ffi --features bindgen --bin uniffi-bindgen -- generate ...
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
clipboardbridge-core = { path = "../core", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = { version = "0.32.2", default-features = false }
