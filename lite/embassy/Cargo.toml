[package]
name = "clipboardbridge-embassy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "The lite member's network code on embassy-net, for the ESP32 and for a Linux test over TAP"
publish = false

[lib]
name = "cbb_embassy"

[[bin]]
# The same code on Linux, over a TAP interface instead of the chip's Wi-Fi.
name = "cbb-embassy"
path = "src/bin/host.rs"
required-features = ["host"]
test = false

[features]
# host builds the Linux program: embassy's executor and clock for std and a
# TAP device as the network card.
host = [
  "clipboardbridge-core/std",
  "dep:critical-section",
  "dep:embassy-executor",
  "dep:embassy-net-tuntap",
  "dep:getrandom",
  "dep:static_cell",
  "embassy-time/std",
]

[dependencies]
clipboardbridge-core = { path = "../core", features = ["tls"] }
embassy-net = { version = "0.9", features = ["medium-ethernet", "proto-ipv4", "tcp"] }
embassy-time = "0.5"
embedded-io-async = "0.7"
critical-section = { version = "1", features = ["std"], optional = true }
embassy-executor = { version = "0.10", features = ["platform-std", "executor-thread"], optional = true }
embassy-net-tuntap = { version = "0.1", optional = true }
getrandom = { version = "0.4", optional = true }
static_cell = { version = "2.1", optional = true }
