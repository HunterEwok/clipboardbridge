[package]
name = "clipboardbridge-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "The protocol core of the clipboardbridge lite member, without the operating system"
publish = false

[lib]
name = "cbb_core"

[features]
# std uses the standard library's mutex; without it the core runs on a
# microcontroller (no_std with alloc) and takes a spin lock.
std = ["getrandom/std"]
# tls adds the member TLS of docs/protocol.md on rustls without its own
# crypto: a small RustCrypto provider, the peer checks, a sans-I/O session
# and the pairing exporter, for the microcontroller and Linux alike.
tls = ["dep:rustls", "dep:aes-gcm", "dep:chacha20poly1305"]
# fuzzing opens the readers of network input to the cargo fuzz targets in
# fuzz/; nothing else turns it on.
fuzzing = []

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes"], optional = true }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, optional = true }
der = { version = "0.8", default-features = false, features = ["alloc", "oid"] }
getrandom = { version = "0.4", default-features = false }
hmac = { version = "0.13", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["alloc", "arithmetic", "ecdsa", "pkcs8"] }
rustls = { version = "0.23.46", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }
spin = { version = "0.12", default-features = false, features = ["mutex", "spin_mutex"] }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets"] }
x509-cert = { version = "0.3", default-features = false, features = ["hazmat"] }

[dev-dependencies]
# The tests compare the exporter with rustls's own, which needs std.
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
serde_json = "1"
