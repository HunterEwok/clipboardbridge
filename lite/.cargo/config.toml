# Static musl binaries, all Rust, linked with Rust's own lld, so no cross
# toolchain is needed: the Raspberry Pi Zero and Pi 1 (ARMv6, 32-bit), and the
# release's ARM64 and x86-64 builds.
# cargo build --release --target arm-unknown-linux-musleabihf
[target.arm-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=ld.lld"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=ld.lld"]

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=ld.lld"]

# The core on a microcontroller: the firmware supplies getrandom's source of
# randomness (its custom backend, the chip's random number generator).
[target.riscv32imac-unknown-none-elf]
rustflags = ["--cfg", 'getrandom_backend="custom"']

[target.xtensa-esp32s3-none-elf]
rustflags = ["--cfg", 'getrandom_backend="custom"']

# The core as WebAssembly for Go's wazero (wasm/): the host supplies
# getrandom's randomness.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", 'getrandom_backend="custom"']
