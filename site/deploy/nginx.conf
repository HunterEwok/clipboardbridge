#
# The website on cbb.tools: /etc/nginx/conf.d/cbb.tools.conf. nginx from
# nginx.org with its ACME module gets and renews the certificates by itself
# (site/README.md). The forwarder and the relay keep their own ports.
#
# No access log: the site promises that it keeps no log of visits
# (site/templates/privacy.html). The error log keeps only what stops nginx.

resolver 127.0.0.53;

acme_issuer letsencrypt {
    uri        https://acme-v02.api.letsencrypt.org/directory;
    state_path /var/cache/nginx/acme-letsencrypt;
    accept_terms_of_service;
}
acme_shared_zone zone=acme_shared:1M;

# TLS 1.2 and 1.3 with forward-secret AEAD ciphers only (Mozilla's
# "intermediate"), no session tickets. nginx.org's nginx.conf sets none of
# these, so they hold for every server here.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:cbb_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

access_log off;
error_log /var/log/nginx/error.log crit;
server_tokens off;

# Closed until launch: everyone sees /soon.html, except a browser that
# opened /preview?key=SECRET and so holds the cookie cbb_preview=SECRET.
# /etc/nginx/cbb-preview.conf keeps the secret out of this file
# (site/README.md, "Closed until launch"); it sets $cbb_closed:
#
#     map $cookie_cbb_preview $cbb_closed { default 1; "SECRET" 0; }
#
# and at the launch becomes "map $cookie_cbb_preview $cbb_closed { default 0; }".
include /etc/nginx/cbb-preview.conf;

# What stays open while the site is closed: the closed page and its
# styles, the revocation mirror and the release channel the apps read, the
# counter, /preview.
map "$cbb_closed:$uri" $cbb_soon {
    default 0;
    "~^1:/(?!static/|attest/|channel/|count|preview$|soon\.html$|\.well-known/|site\.webmanifest$)" 1;
}
map $cbb_closed $cbb_robots {
    1 "noindex";
    default "";
}

# The language of a page's path, for its error page: /ru/x gives ru.
map $uri $site_lang {
    "~^/(?<l>ru|zh|es|ar|sw|he|hi)/" $l;
    default en;
}

# The language chooser (tools/site serve).
upstream cbb_site {
    server 127.0.0.1:8780;
}

# The visit counter (GoatCounter, deploy/cbb-site-stats.service).
upstream cbb_stats {
    server 127.0.0.1:8781;
}

# Port 80 answers the ACME challenges, which the module takes by itself, and
# sends everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name cbb.tools www.cbb.tools;
    location / {
        return 301 https://cbb.tools$request_uri;
    }
}

# HTTP/3 (QUIC) on UDP 443 beside HTTP/2 and HTTP/1.1 on TCP 443: browsers
# learn of it from Alt-Svc and fall back to TCP when UDP is blocked. The
# firewall must let UDP 443 in (site/README.md).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    server_name www.cbb.tools;
    acme_certificate letsencrypt;
    ssl_certificate       $acme_certificate;
    ssl_certificate_key   $acme_certificate_key;
    ssl_certificate_cache max=2;
    return 301 https://cbb.tools$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    server_name cbb.tools;
    acme_certificate letsencrypt;
    ssl_certificate       $acme_certificate;
    ssl_certificate_key   $acme_certificate_key;
    ssl_certificate_cache max=2;

    root /srv/cbb.tools/www;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Robots-Tag $cbb_robots always;

    if ($cbb_soon) {
        rewrite ^ /soon.html last;
    }
    # Opens the closed site in this browser for a year; a wrong key leaves
    # it closed.
    location = /preview {
        add_header Set-Cookie "cbb_preview=$arg_key; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store" always;
        return 302 /;
    }

    # "/" picks the visitor's language; while the chooser is down, English.
    location = / {
        proxy_pass http://cbb_site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 = @english;
    }
    location @english {
        return 302 /en/;
    }

    # The visit counter: its script and what it sends. GoatCounter knows the
    # site by the name "stats.localhost", which its dashboard uses through an
    # SSH tunnel; it gets the visitor's address only to count them, and keeps
    # it nowhere.
    location = /count.js {
        proxy_pass http://cbb_stats;
        proxy_set_header Host stats.localhost;
        expires 1d;
    }
    location = /count {
        proxy_pass http://cbb_stats;
        proxy_set_header Host stats.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # build writes a .gz beside each text file; browsers that take gzip get
    # it as it is, the others the plain file.
    gzip_static on;

    location /static/ {
        expires 7d;
    }
    # The names of the stylesheet and the script carry a hash of their
    # contents: a new version is a new name, so these can be kept for good.
    location ~ "^/static/(style\.[0-9a-f]{8}\.css|site\.[0-9a-f]{8}\.js)$" {
        expires max;
    }
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # The mirror of Google's revocation list (docs/maintaining.md, "The
    # status key"): /srv/cbb.tools/attest.
    location /attest/ {
        root /srv/cbb.tools;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    # The release channel's keys.json and stable.json, renewed weekly by
    # cbb-channel.timer (docs/maintaining.md, "Signed releases"):
    # /srv/cbb.tools/channel, outside www so that a deploy leaves it alone.
    location /channel/ {
        root /srv/cbb.tools;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    # The error pages in the page's language (tools/site build writes
    # them). What went wrong is in the error log, without the visitor.
    error_page 404 /$site_lang/404.html;
    error_page 500 502 503 504 /$site_lang/50x.html;
}
