#
# The website on cbb.tools: /etc/nginx/conf.d/cbb.tools.conf. nginx from
# nginx.org with its ACME module gets and renews the certificates by itself
# (site/README.md). The forwarder and the relay keep their own ports.
#
# No access log: the site promises that it keeps no log of visits
# (site/templates/privacy.html). The error log keeps only what stops nginx.

resolver 127.0.0.53;

acme_issuer letsencrypt {
    uri        https://acme-v02.api.letsencrypt.org/directory;
    state_path /var/cache/nginx/acme-letsencrypt;
    accept_terms_of_service;
}
acme_shared_zone zone=acme_shared:1M;

access_log off;
error_log /var/log/nginx/error.log crit;
server_tokens off;

# The language chooser (tools/site serve).
upstream cbb_site {
    server 127.0.0.1:8780;
}

# Port 80 answers the ACME challenges, which the module takes by itself, and
# sends everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name cbb.tools www.cbb.tools;
    location / {
        return 301 https://cbb.tools$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.cbb.tools;
    acme_certificate letsencrypt;
    ssl_certificate       $acme_certificate;
    ssl_certificate_key   $acme_certificate_key;
    ssl_certificate_cache max=2;
    return 301 https://cbb.tools$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cbb.tools;
    acme_certificate letsencrypt;
    ssl_certificate       $acme_certificate;
    ssl_certificate_key   $acme_certificate_key;
    ssl_certificate_cache max=2;

    root /srv/cbb.tools/www;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # "/" picks the visitor's language; while the chooser is down, English.
    location = / {
        proxy_pass http://cbb_site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 = @english;
    }
    location @english {
        return 302 /en/;
    }

    location /static/ {
        expires 7d;
    }

    # The mirror of Google's revocation list (docs/maintaining.md, "The
    # status key"): /srv/cbb.tools/attest.
    location /attest/ {
        root /srv/cbb.tools;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /en/index.html;
}
